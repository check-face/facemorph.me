# Closure policy (operator, 24 October 2026): beads enforce their own acceptance.
# `br close` refuses while any acceptance-criteria item is unchecked; tick items as you verify them
# (`br update <id> --check-acceptance <n|text>`). There are no close-after waits; CI
# (`scripts/beads/check-closure.mjs`) fails on a closed bead with an unchecked item or an open blocker.
# No bypass: change this file if the operator decides otherwise.
allow_bypass: false
close_policy:
  require_acceptance_criteria_satisfied:
    enabled: true
