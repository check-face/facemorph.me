<!doctype html><meta charset="utf-8"><title>Next runtime artifact check</title>
<style>body{font:16px system-ui;background:#111;color:#ddd}button{padding:12px}img{width:256px}pre{white-space:pre-wrap}</style>
<button id="cpu">Run CPU workflow</button><button id="webgl">Run WebGL workflow</button><button id="webgpu">Run WebGPU workflow</button><button id="cancel">Cancel</button><p id="status">Ready</p><img id="face"><pre id="report"></pre>
<script type="module">
import {createBrowserRuntime} from './src/Next/browser/runtime.mjs';
let runtime;window.runRuntime=async route=>{const report={route,started:new Date().toISOString(),userAgent:navigator.userAgent,visibility:document.visibilityState,events:[]};window.runtimeReport=report;runtime?.dispose();runtime=createBrowserRuntime({onProgress:e=>{document.querySelector('#status').textContent=e.stage+(e.name?' '+e.name:'');report.events.push({stage:e.stage,name:e.name,elapsedMs:e.elapsedMs,at:performance.now()});if(report.events.length>300)report.events.shift();}});try{const start=performance.now();report.admission=await runtime.qualify(route);report.qualificationMs=performance.now()-start;const t=performance.now();const result=await runtime.generate({mode:'seed',value:route==='webgpu'?'2':route==='webgl'?'1':'0'});report.generationMs=performance.now()-t;report.output={size:result.blob.size,type:result.blob.type,provenance:result.provenance,sha256:result.imageSha256,shape:result.latent.shape};document.querySelector('#face').src=URL.createObjectURL(result.blob);runtime.dispose();runtime=createBrowserRuntime();const cacheStart=performance.now();const hit=await runtime.generate({mode:'seed',value:route==='webgpu'?'2':route==='webgl'?'1':'0'});report.cache={hit:hit.cached,ms:performance.now()-cacheStart,modelInitialized:runtime.status().deviceValidated,identical:hit.imageSha256===result.imageSha256};report.completed=report.cache.hit&&report.cache.identical&&!report.cache.modelInitialized;}catch(e){report.error={name:e.name,message:e.message,stack:e.stack};report.completed=false;}finally{runtime.dispose();report.finished=new Date().toISOString();document.querySelector('#status').textContent=report.completed?'Finished successfully':'Failed';document.querySelector('#report').textContent=JSON.stringify(report,null,2);console.log('runtime-test-complete',report);}};
document.querySelector('#cpu').onclick=()=>window.runRuntime('cpu');document.querySelector('#webgl').onclick=()=>window.runRuntime('webgl');document.querySelector('#webgpu').onclick=()=>window.runRuntime('webgpu');document.querySelector('#cancel').onclick=()=>runtime?.cancel();
</script>
