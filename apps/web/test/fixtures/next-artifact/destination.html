<!doctype html>
<!-- Destination artifact shape for check-next-artifact.sh's probe (fm-x6h5): the compact processing selector above the
     first +, outside any <details>, offering Automatic, CPU and WebGPU only. No destination UI artifact exists before
     migration.rendering, so this is a planted input in the place the port puts it. -->
<html lang="en">
  <body>
    <main class="next-product">
      <section class="next-faces">
        <label class="next-route">
          <span>Processing mode</span>
          <select aria-label="Processing mode">
            <option value="auto">Automatic</option>
            <option value="cpu">CPU</option>
            <option value="webgpu">WebGPU</option>
          </select>
        </label>
        <button type="button">+</button>
      </section>
    </main>
  </body>
</html>
