<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>browser-model-manager, developer-hosted model</title>
    <link rel="icon" href="data:," />
    <!-- The installed packages, resolved by the browser itself: no bundler. -->
    <script type="importmap">
      {
        "imports": {
          "@facemorph/stylegan-js": "./node_modules/@facemorph/stylegan-js/dist/index.js",
          "@facemorph/stylegan-js/engine": "./node_modules/@facemorph/stylegan-js/dist/engine/index.js",
          "@facemorph/browser-model-manager": "./node_modules/@facemorph/browser-model-manager/dist/index.js"
        }
      }
    </script>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 16px;
        background: #fff;
        color: #111;
      }
      canvas {
        width: 256px;
        height: 256px;
        background: #eee;
      }
      progress {
        width: 100%;
        max-width: 480px;
      }
      pre {
        max-height: 50vh;
        overflow: auto;
        background: #f4f4f4;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h1>A model from your own static origin</h1>
    <p>
      Nothing is downloaded until you review the download and approve it. The model is AFHQ cat 512,
      whose non-face support is unqualified.
    </p>
    <p>
      <button id="status">Status</button>
      <button id="review">Review download</button>
    </p>
    <p id="consent"></p>
    <p>
      <button id="authorize">Approve and download</button>
      <button id="abort">Abort</button>
    </p>
    <p><progress id="progress" value="0" max="1"></progress> <span id="progress-text"></span></p>
    <p>
      <button id="generate">Generate</button>
      <button id="release">Release</button>
      <button id="evict">Remove from this device</button>
    </p>
    <p><canvas id="image"></canvas></p>
    <pre id="report"></pre>
    <script type="module" src="./out/main.js"></script>
  </body>
</html>
