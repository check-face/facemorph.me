<!doctype html><meta charset="utf-8"><title>Facemorph · video throughput</title><style>body{font:17px system-ui;background:#13171b;color:#eee;margin:32px;line-height:1.5}button{padding:12px;font:inherit}table{border-collapse:collapse}td,th{padding:10px 18px;border-bottom:1px solid #45505a;text-align:left}pre{white-space:pre-wrap;font-size:12px}</style><h1>Video generation · GPU throughput</h1><p>26 unique 1024px faces per default 50-frame, 16fps mirrored video. Random W+ fixtures, loaded models, one warm-up per configuration. Video encoding excluded.</p><button id="run">Run throughput benchmark</button><p id="status">Ready</p><table><thead><tr><th>Batch</th><th>Output</th><th>Seconds / 26 useful faces</th><th>Useful faces/s</th><th>GPU submissions</th></tr></thead><tbody></tbody></table><pre></pre>
<script src="../node_modules/onnxruntime-web/dist/ort.webgpu.min.js"></script><script type="module">
const base='/review-artifacts/browser-onnx-video/',gen='/review-artifacts/browser-onnx-phase1/';const status=document.querySelector('#status');
async function floats(url){const r=await fetch(url);if(!r.ok)throw Error('Fetch failed '+url);return new Float32Array(await r.arrayBuffer());}
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;
 const report={started:new Date().toISOString(),userAgent:navigator.userAgent,runtime:'onnxruntime-web@1.24.3',rows:[],scope:'Synthesis only: no mapping, image conversion, resize, frame encoding or video muxing',workload:'26 useful full-1024px random faces. Batch4 pads to 28 processed faces.'};
 let submits=0;const originalSubmit=GPUQueue.prototype.submit;let device;const size=3*1024*1024;let reference;
 try{
 const adapter=await navigator.gpu.requestAdapter();report.adapter={vendor:adapter.info.vendor,architecture:adapter.info.architecture,isFallbackAdapter:adapter.info.isFallbackAdapter??null};
 ort.env.wasm.numThreads=1;
 GPUQueue.prototype.submit=function(...a){submits++;return originalSubmit.apply(this,a);};
 const w=await floats(base+'w.f32'),manifest=await(await fetch(gen+'manifest.json')).json(),noise={};
 for(const n of manifest.noise)noise[n.name]=new ort.Tensor('float32',await floats(gen+n.file),n.shape);
 const transferCheck=new URLSearchParams(location.search).has('transfer-check');
 for(const batch of (transferCheck?[1]:[1,2,4]))for(const output of (transferCheck?['gpu-buffer']:['cpu','gpu-buffer'])){
  const row={batch,output,usefulFaces:26,processedFaces:Math.ceil(26/batch)*batch};let session;
  try{
   status.textContent=`Loading batch ${batch}, ${output} output…`;let t=performance.now();
   session=await ort.InferenceSession.create(batch===1?gen+'synthesis.onnx':base+`synthesis-b${batch}.onnx`,{executionProviders:['webgpu'],preferredOutputLocation:output});row.loadMs=performance.now()-t;device=ort.env.webgpu.device;row.deviceSource="Actual ORT device captured after session creation";
   const makeFeeds=i=>({...noise,w:new ort.Tensor('float32',w.slice(i*18*512,(i+batch)*18*512),[batch,18,512])});
   status.textContent=`Warming batch ${batch}, ${output}…`;t=performance.now();const warm=(await session.run(makeFeeds(0))).image;await device.queue.onSubmittedWorkDone();row.warmupOutputLocationBeforeReadback=warm.location;const first=await warm.getData();row.warmupMs=performance.now()-t;
   if(!reference)reference=new Float32Array(first.slice(0,size));let max=0;for(let i=0;i<size;i++)max=Math.max(max,Math.abs(first[i]-reference[i]));row.firstFaceMaxDiffVsBatch1=max;row.warmupOutputLocationAfterReadback=warm.location;warm.dispose();
   if(!Number.isFinite(max)||max>.002)throw Error('Batch correctness diagnostic failed: '+max);
   await device.queue.onSubmittedWorkDone();const before=submits;let readbackMs=0;t=performance.now();
   for(let i=0;i<26;i+=batch){
    status.textContent=`Batch ${batch}, ${output}: ${i}/26 faces…`;
    const result=(await session.run(makeFeeds(i))).image;row.measuredOutputLocation=result.location;if(result.location!==output)throw Error('Requested output location not honored: '+result.location);
    if(output==='cpu'){const readStart=performance.now();await result.getData();readbackMs+=performance.now()-readStart;}
    else await device.queue.onSubmittedWorkDone();
    result.dispose();
   }
   await device.queue.onSubmittedWorkDone();row.totalMs=performance.now()-t;row.facesPerSecond=26/(row.totalMs/1000);row.gpuQueueSubmissions=submits-before;row.explicitGetDataMs=readbackMs;row.note='CPU output run() includes ORT readback; explicit getData timing alone does not capture total transfer cost.';row.jsHeap=performance.memory?.usedJSHeapSize??null;row.completed=true;
   const tr=document.createElement('tr');for(const v of [batch,output,(row.totalMs/1000).toFixed(2),row.facesPerSecond.toFixed(2),row.gpuQueueSubmissions]){const td=document.createElement('td');td.textContent=v;tr.append(td);}document.querySelector('tbody').append(tr);
  }catch(e){row.completed=false;row.error=String(e);}
  finally{if(session)await session.release();}
  report.rows.push(row);await fetch('/save/browser.json',{method:'POST',body:JSON.stringify(report,null,2)});
 }
 report.completed=true;status.textContent='Benchmark complete';
 }catch(e){report.error=String(e);status.textContent=String(e);}
 finally{GPUQueue.prototype.submit=originalSubmit;}
 document.querySelector('pre').textContent=JSON.stringify(report,null,2);await fetch('/save/browser.json',{method:'POST',body:JSON.stringify(report,null,2)});
};
</script>
