services:
  preview:
    image: python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de
    restart: unless-stopped
    user: "${PREVIEW_UID:-3001}:${PREVIEW_GID:-3001}"
    command: [python, /app/server.py]
    environment:
      PUBLIC_ORIGINS: https://next.facemorph.me
    volumes:
      - ./server.py:/app/server.py:ro
      - ./assets:/assets:ro
      - ./reports:/reports
    ports:
      - 127.0.0.1:8148:8080
    mem_limit: 256m
    cpus: 1
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  tunnel:
    image: cloudflare/cloudflared@sha256:404528c1cd63c3eb882c257ae524919e4376115e6fe57befca8d603656a91a4c
    restart: unless-stopped
    network_mode: host
    command: [tunnel, --no-autoupdate, run]
    env_file: .env
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
