# GitHub's built-in updater supplies native bot PRs without another service credential.
# The trusted dependency controller dispatches the existing main pipeline on the final
# branch head, and merges only that exact head after its complete group gates pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 4
    versioning-strategy: increase
    ignore:
      - dependency-name: node
        versions: ['>=25'] # Node 24 is the active LTS line; Current is not a shipping target.
    exclude-paths:
      - classic/**
      - self-host/**
    groups:
      react-and-ui:
        patterns:
          [
            react,
            react-dom,
            '@types/react',
            '@types/react-dom',
            '@mui/*',
            '@emotion/*',
            bulma,
            bulma-prefers-dark,
            react-advanced-cropper,
          ]
      onnx-runtime:
        patterns: [onnxruntime-web]
      test-tools:
        patterns: [playwright, '@playwright/*', fast-check, browser-harness]
      build-tools:
        patterns: ['*']
        exclude-patterns:
          [
            react,
            react-dom,
            '@types/react',
            '@types/react-dom',
            '@mui/*',
            '@emotion/*',
            bulma,
            bulma-prefers-dark,
            react-advanced-cropper,
            onnxruntime-web,
            playwright,
            '@playwright/*',
            fast-check,
            browser-harness,
          ]
  - package-ecosystem: pip
    directory: /tools/browser-harness
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    versioning-strategy: increase
    groups:
      test-tools:
        patterns: [browser-harness]
