name: nonface-proof
# Reuse the conversion.qualify hand-off and the exact verify.consumers packs.
# Input locations are runner-local retained assets, never workspace-linked packages.
# Every input digest and the named release artifact are reverified before the browser opens.
on:
  workflow_dispatch:
    inputs:
      inputs_json:
        type: string
        required: true
        description: JSON inputs for nonface.mjs (handoff, modelDir, checkpoint, consumerDir, releaseArtifact, runtimeDir, release)
permissions:
  contents: read
jobs:
  proof:
    runs-on: [self-hosted, eris]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Preserve explicit input identities
        env:
          NONFACE_INPUTS: ${{ inputs.inputs_json }}
        run: |
          node --input-type=module <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          mkdirSync('test-results/nonface-proof', { recursive: true });
          writeFileSync('test-results/nonface-proof/inputs.json', JSON.stringify(JSON.parse(process.env.NONFACE_INPUTS), null, 2) + '\n');
          JS
      - name: Admission and network boundary regressions
        run: node --test scripts/packages/consumer-gates/nonface.test.mjs scripts/packages/consumer-gates/nonface-handoff.test.mjs
      - name: Joint proof from retained checkpoint to recoverable exports
        run: node scripts/packages/consumer-gates/nonface.mjs --inputs test-results/nonface-proof/inputs.json --out test-results/nonface-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sub-result-3-nonface-${{ github.run_id }}
          path: test-results/nonface-proof
          if-no-files-found: error
