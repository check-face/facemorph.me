name: ci-shared
# fm-o8xn: the shared CI pieces on every change to them. On eris (Playwright browsers, system Chromium and
# browser-harness 0.1.8 are there): strict typecheck; the artifact lookup tests against the real GitHub API; the path
# filter coverage and lane check; the interception fixture page through both helpers (Playwright and CDP), whose
# per-assertion JSON logs are uploaded, the same format the lanes and e2e tests emit. Then the lookup action fetches
# the pinned control's classic next-site artifact by explicit inputs and verifies it, and refuses an owner/name.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  helpers:
    runs-on: [self-hosted, eris]
    timeout-minutes: 20
    env:
      INTERCEPT_LOG_DIR: ${{ github.workspace }}/test-results/intercept
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - name: Typecheck (strict)
        run: npx tsc -p scripts/ci
      - name: Lookup, path filters and the Playwright helper
        run: node --test scripts/ci/fetch-artifact.test.ts scripts/ci/path-filters.test.ts scripts/ci/changes.test.ts scripts/ci/intercept/intercept.test.ts
      - name: The CDP helper (browser-harness)
        env:
          BROWSER_HARNESS: /home/cdilga/Work/runs/venv-bh/bin/browser-harness
        run: python3 scripts/ci/intercept/test_intercept.py
      - name: The device-lease wrapper (real processes and flocks on a temporary lease directory)
        run: python3 scripts/ci/lease/test_lease_run.py
      - name: The wrapper on this machine's own lease journals its run
        id: leased
        uses: ./.github/actions/device-lease
        with:
          device: eris
          lane: build
          timeout: '120'
          wait: '1800'
          command: echo "leased on $(hostname -s) as $FACEMORPH_LEASE_RUN"
      - name: The journal has that run
        run: |
          grep -q "\"id\": \"${{ steps.leased.outputs.run_id }}\"" "$HOME/.local/state/facemorph/lease/runs.jsonl"
      - name: Path filters of this tree
        run: node scripts/ci/path-filters.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intercept-assertions-${{ github.run_id }}
          path: test-results/intercept/
          retention-days: 14
          if-no-files-found: warn
  lookup:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: control
        name: Fetch the pinned control's classic next-site artifact by explicit inputs
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: '295956585'
          workflow: .github/workflows/next-site.yml
          run_id: '40056009101'
          commit: 551b60726290b2d67a32c62477b2fd964de51f96
          artifact_name: next-site-551b60726290b2d67a32c62477b2fd964de51f96
          out: .cache/lookup/control
      - name: The digest is the pinned control's
        env:
          DIGEST: ${{ steps.control.outputs.artifact_digest }}
          PROVENANCE: ${{ steps.control.outputs.provenance_json }}
        run: |
          want=$(node -p 'require("./autoresearch/drivers/control.json").treeSha256')
          echo "digest $DIGEST, pinned $want; provenance $PROVENANCE" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$DIGEST" = "$want"
      - id: byname
        name: An owner/name in place of the numeric ID is refused
        continue-on-error: true
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: check-face/facemorph.me-classic
          workflow: .github/workflows/next-site.yml
          run_id: '40056009101'
          commit: 551b60726290b2d67a32c62477b2fd964de51f96
          artifact_name: next-site-551b60726290b2d67a32c62477b2fd964de51f96
          out: .cache/lookup/byname
      - name: That refusal happened
        run: test "${{ steps.byname.outcome }}" = failure
