name: decode-measure
# fm-4cp: the decode-ceiling measurement runs on demand (workflow_dispatch) on the triton
# runner under the machine's device lease, so ceiling inputs are re-measurable in CI and
# failure screenshots are kept as workflow artifacts.
on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Playwright browser to measure'
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit]
concurrency:
  group: decode-measure
  cancel-in-progress: false
jobs:
  measure:
    runs-on: [self-hosted, triton]
    steps:
      - uses: actions/checkout@v4
      - name: Classic checkout at the frozen import revision (read-only, for the candidate code)
        uses: actions/checkout@v4
        with:
          repository: check-face/facemorph.me-classic
          ref: a42829bb0582b5a7a55ba6b1045a05861612b8a5
          path: classic
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/decode-measure/fixtures.test.mjs
      - name: Measure under the device lease
        run: >
          classic/autoresearch/run.py --lane browser-cpu --device triton --timeout 1800 --wait 300 --
          mise x uv@0.12.21 -- uv run --with playwright python
          tools/decode-measure/measure.py --browser "${{ inputs.browser }}"
      - uses: actions/upload-artifact@v4
        with:
          name: decode-measurements-${{ inputs.browser }}
          path: |
            tools/decode-measure/measurements/
            tools/decode-measure/measurements/artifacts/
          if-no-files-found: error
          retention-days: 90
