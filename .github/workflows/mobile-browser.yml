name: Mobile browser components
on:
  workflow_dispatch:
  push:
    branches: ['master', 'candidate/mobile-ci-*', 'candidate/next-delivery-*']
    paths: ['tests/mobile/**', 'src/Next/**', 'scripts/next-ios-sim.py', '.github/workflows/mobile-browser.yml']
  pull_request:
    paths: ['tests/mobile/**', 'src/Next/**', 'scripts/next-ios-sim.py', '.github/workflows/mobile-browser.yml']
permissions:
  contents: read
concurrency:
  group: mobile-components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/mobile -p 'test_*.py'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Chrome in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tests/mobile/run.py --platform android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-android-components
          path: mobile-evidence
          if-no-files-found: warn
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/mobile -p 'test_*.py'
      - name: Safari in iOS Simulator
        run: python3 tests/mobile/run.py --platform ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-components
          path: mobile-evidence
          if-no-files-found: warn

  # global.json pins the .NET 5 SDK, which has no Apple-silicon build and is not installed on the
  # macOS runner, so the Simulator lane could never build the thing it was meant to measure. The
  # bytes are built where every other lane builds them — the same 5.0-focal container — and handed
  # over, which also means the Simulator measures that artifact rather than a macOS-local rebuild.
  ios-product-artifact:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container: mcr.microsoft.com/dotnet/sdk:5.0-focal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build the artifact under test
        run: npm run build:next
      - uses: actions/upload-artifact@v4
        with:
          name: next-ios-artifact-${{ github.run_id }}
          path: deploy-next/
          if-no-files-found: error
          retention-days: 7
  # The memory-constrained tier drives every architecture decision here and is the one with no
  # physical evidence at all. The Simulator exposes no WebGPU adapter, so this lane cannot rank
  # the fast path and does not try; it answers what the constrained tier does with a change —
  # route admitted, face produced at all, and at what memory. Per change, not per release.
  ios-product-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    needs: ios-product-artifact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: next-ios-artifact-${{ github.run_id }}
          path: deploy-next
      - name: Product in an iOS Simulator
        run: python3 scripts/next-ios-sim.py --device 'iPhone 16 Pro' --evidence next-ios-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-ios-simulator-${{ github.run_id }}
          path: next-ios-evidence/
          retention-days: 14
          if-no-files-found: warn
