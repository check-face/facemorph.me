name: cloudflare-model-host
# cloudflare-model-host (fm-3osh): chunk -> reconstruct, staging against the manager's contract and JSON schema,
# dry-run publication with paid-service and model-terms refusals, and the Cloudflare limits, on planted bundles
# and on the qualified runtime the device lab keeps on eris; the mirror Worker in workerd (fm-fy2.14). Then the
# shared package-tarball-content-scan: its self-test, and the scan of the packed tarball (JSON report kept as an
# artifact).
on:
  workflow_call:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, eris]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager -w packages/cloudflare-model-host
      - name: Host tests, with the qualified runtime as the real staged set
        working-directory: packages/cloudflare-model-host
        env:
          FACEMORPH_REQUIRE_RUNTIME: '1'
        run: |
          export FACEMORPH_RUNTIME_DIR="$HOME/.cache/facemorph-device-lab/runtime-public"
          node --test test/*.test.ts
      # workerd needs glibc 2.32+, which eris has and triton (npm test in scaffold) does not (fm-fy2.14).
      - name: The mirror Worker in workerd, against a real local upstream
        run: npm run test:workerd -w packages/cloudflare-model-host
      - name: Diagnostics collector in workerd, with real local R2 and KV
        run: node --test hosting/next-cloudflare/collector.workerd.mjs
      - name: API-free catalogue staging and both cf dry-run phases
        env:
          MATERIALIZE_CF_DRY_RUN: '1'
          CF_SEND_TELEMETRY: 'false'
        run: node --test hosting/gallery/materialize.test.mjs
      - name: Manager acquisition and forced-500 fallback on the deployed test origins
        env:
          STAGING_ORIGIN: https://facemorph-model-staging.cdilga.workers.dev
          STAGING_MIRROR: https://facemorph-model-staging-mirror.cdilga.workers.dev
          STAGING_OUT: ${{ github.workspace }}/test-results/model-staging
        run: npm run test:staging -w packages/cloudflare-model-host
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: model-staging-failure-${{ github.run_id }}
          path: test-results/model-staging
          if-no-files-found: ignore
      - name: package-tarball-content-scan self-test
        run: node --test scripts/packages/check-tarball-contents.test.mjs
      - name: Scan the packed cloudflare-model-host tarball
        run: |
          set -euo pipefail
          mkdir -p scan
          npm pack -w packages/cloudflare-model-host --pack-destination scan
          node scripts/packages/check-tarball-contents.mjs --profile cloudflare-model-host \
            --input scan/facemorph-cloudflare-model-host-0.0.0.tgz --report scan/cloudflare-model-host.json || true
          # Every rule must be clean except the LICENSE file, which waits on the licence decision (fm-oagi).
          node -e '
            const r = JSON.parse(require("fs").readFileSync("scan/cloudflare-model-host.json", "utf8"));
            const other = r.findings.filter((f) => !(f.rule === "required-file" && f.path === "LICENSE"));
            console.log(JSON.stringify({ outcome: r.outcome, files: r.files.length, requiredMissing: r.requiredMissing, other }));
            if (other.length || r.files.length === 0) process.exit(1);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-model-host-scan-${{ github.run_id }}
          path: scan/cloudflare-model-host.json
