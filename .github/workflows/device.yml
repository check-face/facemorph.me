name: device
# Best effort (fm-fy2.11): the hosted macOS, Windows, Android emulator and iOS Simulator lanes on a release run's
# artifact. Results are recorded; this workflow never blocks check.yml or release.yml, and its harness is not
# repaired in place. A real product failure seen here becomes a bead.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      run:
        description: release.yml run id whose artifact to test
        required: true
      commit:
        description: Full commit SHA that run built
        required: true
# shell: bash runs every step with -eo pipefail; the default (bash -e) drops a failure piped into tee.
defaults:
  run:
    shell: bash
permissions:
  contents: read
  actions: read
concurrency:
  group: device-${{ inputs.run || github.event.workflow_run.id }}
  cancel-in-progress: false
env:
  RUN: ${{ inputs.run || github.event.workflow_run.id }}
  COMMIT: ${{ inputs.commit || github.event.workflow_run.head_sha }}
  RUNTIME_SHA: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
  LANES: macos-webkit,macos-firefox,macos-chrome,windows-chrome,windows-msedge,android-emulator-chrome,ios-simulator-safari
jobs:
  # A release that built nothing (site=control, live, promote or rollback) has no artifact to test: skip, not fail.
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/artifacts?per_page=100" --jq '.artifacts[].name')
          if grep -qx "next-site-$COMMIT" <<<"$names"; then echo present=true >> "$GITHUB_OUTPUT"; else echo "run $RUN built no next-site-$COMMIT: nothing to test" | tee -a "$GITHUB_STEP_SUMMARY"; echo present=false >> "$GITHUB_OUTPUT"; fi

  desktop:
    needs: artifact
    if: needs.artifact.outputs.present == 'true'
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, browser: webkit, lane: macos-webkit, install: webkit }
          - { os: macos-15, browser: firefox, lane: macos-firefox, install: firefox }
          - { os: macos-15, browser: chrome, lane: macos-chrome, install: '' }
          - { os: windows-latest, browser: chrome, lane: windows-chrome, install: '' }
          - { os: windows-latest, browser: msedge, lane: windows-msedge, install: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: .github/workflows/release.yml
          run_id: ${{ env.RUN }}
          commit: ${{ env.COMMIT }}
          artifact_name: next-site-${{ env.COMMIT }}
          out: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --upgrade playwright
      - if: matrix.install != ''
        run: python -m playwright install --with-deps ${{ matrix.install }}
      - name: Manager component dependencies on macOS
        if: matrix.browser == 'webkit' || matrix.browser == 'firefox'
        uses: ./.github/actions/setup-workspace
      - name: Build manager components on macOS
        if: matrix.browser == 'webkit' || matrix.browser == 'firefox'
        run: |
          npm run build -w packages/stylegan-js -w packages/browser-model-manager
          npx playwright install ${{ matrix.browser }}
      - name: Native manager components on ${{ matrix.lane }}
        if: matrix.browser == 'webkit' || matrix.browser == 'firefox'
        uses: ./.github/actions/run-command
        env:
          FACEMORPH_MANAGER_ENGINE: ${{ matrix.browser }}
          FACEMORPH_REQUIRE_MANAGER_BROWSER: '1'
          FACEMORPH_ISOLATE_TEST_NETWORK: '0'
        with:
          timeout: '900'
          # The Linux-only netlink namespace wrapper stays disabled on these macOS runners.
          command: node packages/browser-model-manager/test/run.mjs --test-concurrency=1 packages/browser-model-manager/test/cache-local.test.ts packages/browser-model-manager/test/handles-tabs.test.ts packages/browser-model-manager/test/acquisition.test.ts packages/browser-model-manager/test/acquisition-deadline.test.ts packages/browser-model-manager/test/slots-browser.test.ts packages/browser-model-manager/test/worker-storage.test.ts packages/browser-model-manager/test/storage-permission.test.ts packages/browser-model-manager/test/uncached-browser.test.ts
      - name: Loaded manager CPU handle lifecycle on ${{ matrix.lane }}
        if: matrix.browser == 'webkit' || matrix.browser == 'firefox'
        uses: ./.github/actions/run-command
        env:
          ACCEPT_MODEL_TERMS: 'yes'
          FACEMORPH_MANAGER_ENGINE: ${{ matrix.browser }}
          FACEMORPH_REQUIRE_MANAGER_BROWSER: '1'
          FACEMORPH_REQUIRE_RUNTIME: '1'
          FACEMORPH_RUNTIME_CACHE: ${{ runner.temp }}/manager-loaded-runtime
        with:
          timeout: '600'
          command: |
            node packages/browser-model-manager/test/support/acquire-loaded-runtime.mjs "$FACEMORPH_RUNTIME_CACHE"
            node packages/browser-model-manager/test/run.mjs packages/browser-model-manager/test/loaded-browser.component.ts
      - name: Journeys on ${{ matrix.lane }}
        working-directory: tools/device-lab
        run: python hosted.py browser --lane ${{ matrix.lane }} --browser ${{ matrix.browser }} --artifact ../../artifact/deploy-next --runtime-sha ${{ env.RUNTIME_SHA }} --out ../../lane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-${{ matrix.lane }}
          path: |
            lane/*.json
            lane/*.png
            lane/*.zip
            test-results/manager-cache/
          if-no-files-found: warn
          retention-days: 30
  android:
    needs: artifact
    if: needs.artifact.outputs.present == 'true'
    name: android-emulator-chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: .github/workflows/release.yml
          run_id: ${{ env.RUN }}
          commit: ${{ env.COMMIT }}
          artifact_name: next-site-${{ env.COMMIT }}
          out: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --upgrade playwright
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Journeys in Chrome on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 8192M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: tools/device-lab
          script: python hosted.py android --lane android-emulator-chrome --artifact ../../artifact/deploy-next --runtime-sha ${{ env.RUNTIME_SHA }} --out ../../lane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-android-emulator-chrome
          path: |
            lane/*.json
            lane/*.png
            lane/*.zip
          if-no-files-found: warn
          retention-days: 30
  ios:
    needs: artifact
    if: needs.artifact.outputs.present == 'true'
    name: ios-simulator-safari
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: .github/workflows/release.yml
          run_id: ${{ env.RUN }}
          commit: ${{ env.COMMIT }}
          artifact_name: next-site-${{ env.COMMIT }}
          out: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Journeys in Safari on the iOS Simulator
        working-directory: tools/device-lab
        run: python hosted.py ios --lane ios-simulator-safari --device 'iPhone 16 Pro' --artifact ../../artifact/deploy-next --runtime-sha ${{ env.RUNTIME_SHA }} --out ../../lane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-ios-simulator-safari
          path: |
            lane/*.json
            lane/*.png
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: [artifact, desktop, android, ios]
    if: always() && needs.artifact.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lane-*
          path: lanes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One row per lane; a failed or missing lane fails this job
        shell: bash # bash -eo pipefail: without it `| tee` hides the summary's exit status
        run: python tools/device-lab/hosted.py summary lanes --expect "$LANES" | tee -a "$GITHUB_STEP_SUMMARY"
