name: Desktop candidate validation
on:
  push:
    branches: ['candidate/desktop-ci*']
  pull_request:
    paths: ['desktop/**', 'src/**', 'webpack.config.js', 'package*.json', '.github/workflows/desktop*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-22.04
    container: mcr.microsoft.com/dotnet/sdk:5.0-focal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:self-host
      - run: node desktop/scripts/stage-frontend.mjs --source deploy-self-host
      - run: node --test desktop/tests/packaging.test.mjs
      - run: node --test src/Next/Assets/model-cache.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-shared-frontend
          path: desktop/frontend
          if-no-files-found: error
          retention-days: 14
  package:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            bundles: deb
          - runner: windows-2022
            platform: windows
            bundles: nsis
          - runner: macos-14
            platform: macos
            bundles: app
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-shared-frontend
          path: desktop/frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux WebKit and packaging prerequisites
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install pinned shell toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          npm install --prefix desktop/ci-tools --no-save @tauri-apps/cli@2.10.1
      - name: Generate platform icons from committed source
        working-directory: desktop
        run: node ci-tools/node_modules/@tauri-apps/cli/tauri.js icon src-tauri/icons/icon.png --output src-tauri/icons
      - name: Verify protocol, recovery and updater signature primitive
        run: |
          export CHECKFACE_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml
          python -m unittest discover -s desktop/tests -p 'test_*.py' -v
      - name: Checkout pinned independent Torch reference implementation
        if: matrix.platform != 'macos'
        uses: actions/checkout@v4
        with:
          repository: NVlabs/stylegan2-ada-pytorch
          ref: d72cc7d041b42ec8e806021a205ed9349f87c6a4
          path: .ci-stylegan
          persist-credentials: false
      - name: Install pinned full-model CPU dependencies
        if: matrix.platform != 'macos'
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r desktop/native/requirements-ci-export.txt
      - name: Prepare portable full-model CPU integration bundle
        if: matrix.platform != 'macos'
        run: python desktop/scripts/prepare-ci-bundle.py --output desktop/local-native --cache-directory "$RUNNER_TEMP/checkface-model-source" --stylegan-directory .ci-stylegan --accept-research-license --threads 2
      - name: Execute real CPU synthesis against independent Torch references
        if: matrix.platform != 'macos'
        env:
          CHECKFACE_PROBE_TIMEOUT_SECONDS: '900'
          CHECKFACE_NATIVE_DIAGNOSTICS: '1'
        run: |
          cargo build --release --locked --manifest-path desktop/src-tauri/Cargo.toml --bin native-probe
          probe=desktop/src-tauri/target/release/native-probe
          if [ "${{ matrix.platform }}" = "windows" ]; then probe="$probe.exe"; fi
          python desktop/tests/native_integration.py --probe "$probe" --bundle desktop/local-native/bundle.json --report desktop/inference-evidence/verification.json
      - name: Preserve CPU diagnostic evidence without weights
        if: always() && matrix.platform != 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-cpu-integration-${{ matrix.platform }}
          path: desktop/inference-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Build unsigned candidate package
        working-directory: desktop
        run: node ci-tools/node_modules/@tauri-apps/cli/tauri.js build --config candidate-config.json --bundles ${{ matrix.bundles }}
      - name: Collect and verify downloadable bytes
        run: python desktop/scripts/candidate-artifacts.py --bundle desktop/src-tauri/target/release/bundle --output desktop/candidate-artifacts --platform ${{ matrix.platform }} --revision "$GITHUB_SHA"
      - name: Install and launch Linux package
        if: matrix.platform == 'linux'
        run: |
          sudo dpkg -i desktop/candidate-artifacts/*.deb
          xvfb-run -a python desktop/tests/startup_smoke.py --binary /usr/bin/checkface-desktop --report desktop/candidate-artifacts/startup.json
      - name: Install and launch Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem desktop/candidate-artifacts/*.exe | Select-Object -First 1).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'CheckFace installed space'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $binary = Join-Path $destination 'checkface-desktop.exe'
          if (-not (Test-Path $binary)) { throw 'Installed executable missing' }
          python desktop/tests/startup_smoke.py --binary $binary --report desktop/candidate-artifacts/startup.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract and launch macOS app
        if: matrix.platform == 'macos'
        run: |
          mkdir -p "$RUNNER_TEMP/CheckFace installed space"
          ditto -x -k desktop/candidate-artifacts/*.zip "$RUNNER_TEMP/CheckFace installed space"
          python desktop/tests/startup_smoke.py --binary "$RUNNER_TEMP/CheckFace installed space/CheckFace Preview.app/Contents/MacOS/checkface-desktop" --report desktop/candidate-artifacts/startup.json
      - name: Recheck distributable inventory
        run: python desktop/scripts/candidate-artifacts.py --output desktop/candidate-artifacts --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-candidate-${{ matrix.platform }}
          path: desktop/candidate-artifacts
          if-no-files-found: warn
          retention-days: 14
