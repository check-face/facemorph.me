name: app-contracts
# App contracts (fm-s9n): apps/web/src/contracts type-checked without DOM or Node globals, the type-level
# tests (tile action table, cache shape), batch/progress/scheduler walkthroughs, the recovery classification
# vectors read through stylegan-js's real reader, export identity and name allocation vectors, and fixed-seed
# fuzzing of the batch payload and words validators.
on:
  workflow_call:
    inputs:
      shared_build:
        type: boolean
        default: false
        description: Reuse the exact compiled workspace from this main run
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/restore-workspace-build
        if: inputs.shared_build
      # The manager's exports name dist/ only (no source condition), so its declarations are built first.
      - if: ${{ !inputs.shared_build }}
        run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - name: Contracts without DOM or Node globals; then the tests' types
        run: >-
          npx tsc -p apps/web/src/contracts && npx tsc -p apps/web/src/contracts/tsconfig.test.json &&
          npx tsc -p apps/web/src/media && npx tsc -p apps/web/src/media/tsconfig.test.json &&
          npx tsc -p apps/web/src/admission && npx tsc -p apps/web/src/admission/tsconfig.test.json
      - name: Contract tests (workspace packages read from source)
        working-directory: apps/web
        run: node --conditions=source --test test/contracts/*.test.ts test/media/*.test.ts test/admission/*.test.ts
