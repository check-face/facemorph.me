name: names-snapshot
# Tests for the names snapshot (bead fm-old, scripts/names-snapshot/): pure manifest logic, plus the snapshot
# and restore against a real S3-compatible server (SeaweedFS in Docker) and real local origins.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    # SeaweedFS integration needs Docker; the tempcpu portable runners do not provide it.
    runs-on: [self-hosted, eris-build]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts/names-snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
        with:
          directory: scripts/names-snapshot
      - run: docker info --format '{{.ServerVersion}}'
      - run: node --test plan.test.mjs local.test.mjs snapshot.test.mjs
        env:
          SNAPSHOT_EVIDENCE_DIR: ${{ runner.temp }}/names-snapshot-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: names-snapshot-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/names-snapshot-evidence
          if-no-files-found: ignore
