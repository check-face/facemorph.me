name: names-snapshot
# Tests for the names snapshot (bead fm-old, scripts/names-snapshot/): pure manifest logic, plus the snapshot
# and restore against a real S3-compatible server (SeaweedFS in Docker) and real local origins.
on:
  push:
    branches: [main]
    paths: ['scripts/names-snapshot/**', '.github/workflows/names-snapshot.yml']
  workflow_dispatch:
concurrency:
  group: names-snapshot
  cancel-in-progress: false
jobs:
  test:
    runs-on: [self-hosted, triton]
    defaults:
      run:
        working-directory: scripts/names-snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: docker info --format '{{.ServerVersion}}'
      - run: node --test plan.test.mjs snapshot.test.mjs
