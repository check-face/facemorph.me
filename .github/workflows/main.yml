name: main
# The one CI pipeline for main (fm-98po, the operator's merge-queue rule, 25 October 2026). Exactly one run is in
# progress at a time and it is never cancelled. Pushes that land while it runs do not start their own runs: GitHub
# keeps one pending run, a newer push replaces it, and when the running one finishes that pending run takes every
# change pushed since, stacked. The `changes` job diffs from the head of the last successful main.yml run (not the
# previous commit), so a change that a failed or stacked run did not cover is still covered, and selects the lanes
# whose paths it touches (scripts/ci/path-filters.json, scripts/ci/changes.ts). Each lane is a reusable workflow
# called below; a lane that is not selected is skipped. Beads close on locally executed gates before
# their commits are pushed; this pipeline is the backstop. The agent inspecting a red run diagnoses it and
# updates/reopens the responsible bead; an automatic CI-to-Beads handler is not implemented.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: main
  cancel-in-progress: false
jobs:
  changes:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Lanes for the changes since the last green main.yml run (every lane on a dispatch or with no green run)
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=''
          if [ "${{ github.event_name }}" = push ]; then
            base=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?branch=main&status=success&per_page=1" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).workflow_runs[0]?.head_sha??""))')
          fi
          node scripts/ci/changes.ts --base "$base" --head "$GITHUB_SHA"
  app-contracts:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'app-contracts')
    uses: ./.github/workflows/app-contracts.yml
    secrets: inherit
  beads-check:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'beads-check')
    uses: ./.github/workflows/beads-check.yml
    secrets: inherit
  beads-site:
