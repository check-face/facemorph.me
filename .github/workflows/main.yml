    if: contains(fromJSON(needs.changes.outputs.lanes), 'build-identity')
    uses: ./.github/workflows/build-identity.yml
    with:
      base: ${{ needs.changes.outputs.base }}
    secrets: inherit
  ci-shared:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.lanes), 'ci-shared')
    uses: ./.github/workflows/ci-shared.yml
    permissions:
      contents: read
