name: hosting-staging
# fm-8tyu: classic's app-side hosting/ tree is imported byte-identical (hosting/PROVENANCE.json) and staging is
# reproducible from a clean clone: the imported stage.py on this clone's deploy-next/ (the control) and the verified
# runtime acquisition must give exactly classic's staged tree (classic's own mirror-runtime.py and stage.py, from its Git
# objects at the frozen revision, on the same artifact). Every runtime pin is verified by the shared portable
# acquisition step.
on:
  workflow_call:
    inputs:
      shared_build:
        type: boolean
        default: false
        description: Reuse the exact compiled workspace from this main run
  workflow_dispatch:
jobs:
  staging:
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 90
    # The hosting tests run promote.py/stage.py from the checkout; bytecode caches would land in hosting/.
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Classic, read from Git objects only
        uses: actions/checkout@v4
        with:
          repository: facemorph-me/facemorph.me-classic
          path: .cache/classic
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/restore-workspace-build
        if: inputs.shared_build
      - uses: ./.github/actions/setup-runtime
      # The deploy driver's warm and mirror-deploy run the model-host package's CLI (fm-6fx6).
      - if: ${{ !inputs.shared_build }}
        run: npm run build -w packages/stylegan-js -w packages/browser-model-manager -w packages/cloudflare-model-host
      - run: node --test 'scripts/hosting/*.test.mjs'
      - name: Imported files equal the frozen revision
        run: node scripts/hosting/import-hosting.mjs --check --classic .cache/classic
      - name: No .wrangler state, secrets or weights in hosting/
        run: node scripts/hosting/scan-hosting.mjs
      - uses: ./.github/actions/restore-site
        if: inputs.shared_build
      - if: inputs.shared_build
        run: npm run build:next -- --check
      - name: build:next (monorepo destination)
        if: ${{ !inputs.shared_build }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:next
      - name: Classic's staging on the same artifact, then the clean-clone staging compared file by file
        uses: ./.github/actions/run-command
        with:
          timeout: '1800'
          command: >-
            scripts/hosting/classic-reference.sh .cache/classic "$FACEMORPH_RUNTIME_DIR" .cache/classic-staging.json
            && node scripts/hosting/stage.mjs --runtime "$FACEMORPH_RUNTIME_DIR" --out .cache/staging
            --record .cache/staging.json --compare .cache/classic-staging.json | tee -a "$GITHUB_STEP_SUMMARY"
