name: New site artifact
# Candidate pushes, PRs and manual runs build once, then qualify those exact bytes.
# main.yml calls the two children separately so artifact consumers do not await qualification.
on:
  workflow_call:
  push:
    branches: ['candidate/*'] # main runs it through main.yml (fm-98po)
    paths:
      [
        'apps/web/**',
        'packages/**',
        'scripts/**',
        'hosting/**',
        'services/**',
        'tests/**',
        'package.json',
        'package-lock.json',
        'tsconfig*.json',
        '.oxlintrc.json',
        '.oxfmtrc.json',
        '.nvmrc',
        '.github/actions/**',
        '.github/workflows/next-site.yml',
        '.github/workflows/next-site-artifact.yml',
        '.github/workflows/next-site-qualify.yml',
        '.github/workflows/next-e2e.yml',
      ]
  pull_request:
    paths:
      [
        'apps/web/**',
        'packages/**',
        'scripts/**',
        'hosting/**',
        'services/**',
        'tests/**',
        'package.json',
        'package-lock.json',
        'tsconfig*.json',
        '.oxlintrc.json',
        '.oxfmtrc.json',
        '.nvmrc',
        '.github/actions/**',
        '.github/workflows/next-site.yml',
        '.github/workflows/next-site-artifact.yml',
        '.github/workflows/next-site-qualify.yml',
        '.github/workflows/next-e2e.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: next-site-${{ github.ref }}
  cancel-in-progress: false
jobs:
  artifact:
    uses: ./.github/workflows/next-site-artifact.yml
    permissions:
      contents: read
      actions: read
    with:
      artifact_workflow: ${{ github.workflow == 'main' && '.github/workflows/main.yml' || '.github/workflows/next-site.yml' }}
  qualify:
    needs: artifact
    uses: ./.github/workflows/next-site-qualify.yml
    permissions:
      contents: read
      actions: read
    with:
      artifact_run: ${{ github.run_id }}
      artifact_workflow: ${{ github.workflow == 'main' && '.github/workflows/main.yml' || '.github/workflows/next-site.yml' }}
      artifact_commit: ${{ github.sha }}
      artifact_name: next-site-${{ github.sha }}
      runtime_sha: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
