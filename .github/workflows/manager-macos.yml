name: manager-macos
# Dispatch-only fast iteration for the browser-model-manager's native component cells on hosted macOS (fm-fy2.13).
# The same command and env as hosted-lanes' "Native manager components" step, without the journey artifact.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Playwright engine
        type: choice
        options: [webkit, firefox]
        default: webkit
      probe:
        description: Also print where a persistent WebKit profile keeps OPFS data
        type: boolean
        default: false
      args:
        description: Extra node --test arguments before the files (e.g. --test-reporter=tap --test-timeout=120000)
        type: string
        default: ''
      files:
        description: Test files (default is the hosted-lanes set)
        type: string
        default: ''
      repeat:
        description: Independent macOS jobs running the same set (JSON list of labels)
        type: string
        default: '[1]'
      watch:
        description: Seconds before a watchdog dumps processes, Node reports and stops a stuck run
        type: string
        default: '300'
      debug:
        description: DEBUG value for Playwright logging (e.g. pw:api,pw:browser)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  manager:
    name: manager-macos-${{ inputs.engine }}-${{ matrix.run }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(inputs.repeat) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - run: |
          npm run build -w packages/stylegan-js -w packages/browser-model-manager
          npx playwright install ${{ inputs.engine }}
      - name: OPFS location probe
        if: inputs.probe && inputs.engine == 'webkit'
        run: |
          cat > "$RUNNER_TEMP/probe.mjs" <<'EOF'
          import { createServer } from 'node:http';
          import { join } from 'node:path';
          import { pathToFileURL } from 'node:url';
          const support = pathToFileURL(join(process.cwd(), 'packages/browser-model-manager/test/support/browser.ts'));
          const { componentBrowser } = await import(support.href);
          const { browser, newContext } = await componentBrowser();
          const server = createServer((_, res) => res.end('<!doctype html><title>p</title>'));
          await new Promise((r) => server.listen(0, '127.0.0.1', r));
          const url = `http://localhost:${server.address().port}/`;
          for (const label of ['first', 'second']) {
            const ctx = await newContext();
            const page = await ctx.newPage();
            await page.goto(url);
            const seen = await page.evaluate(async (label) => {
              const root = await navigator.storage.getDirectory();
              const names = [];
              for await (const [n] of root.entries()) names.push(n);
              const h = await root.getFileHandle(`marker-${label}`, { create: true });
              const w = await h.createWritable();
              await w.write(new Uint8Array(1234));
              await w.close();
              return names;
            }, label);
            console.log(`${label} context saw before write: ${JSON.stringify(seen)}`);
            await ctx.close();
          }
          await browser.close();
          server.close();
          EOF
          FACEMORPH_MANAGER_ENGINE=webkit node "$RUNNER_TEMP/probe.mjs"
          echo '--- files named or dirs holding OPFS data modified in the last 10 minutes'
          find "$HOME/Library/WebKit" "${TMPDIR:-/tmp}" -mmin -10 -ipath '*FileSystem/marker*' 2>/dev/null | head -20
      - name: Native manager components on macos-${{ inputs.engine }}
        env:
          FACEMORPH_MANAGER_ENGINE: ${{ inputs.engine }}
          FACEMORPH_REQUIRE_MANAGER_BROWSER: '1'
          FACEMORPH_ISOLATE_TEST_NETWORK: '0'
          ARGS: ${{ inputs.args }}
          FILES: ${{ inputs.files }}
          WATCH: ${{ inputs.watch }}
          DEBUG: ${{ inputs.debug }}
        run: |
          reports="$PWD/test-results/manager-cache/node-reports"
          mkdir -p "$reports"
          export NODE_OPTIONS="--report-on-signal --report-signal=SIGUSR2 --report-directory=$reports"
          node packages/browser-model-manager/test/run.mjs --test-concurrency=1 $ARGS ${FILES:-packages/browser-model-manager/test/cache-local.test.ts packages/browser-model-manager/test/handles-tabs.test.ts packages/browser-model-manager/test/acquisition.test.ts packages/browser-model-manager/test/acquisition-deadline.test.ts packages/browser-model-manager/test/slots-browser.test.ts packages/browser-model-manager/test/worker-storage.test.ts packages/browser-model-manager/test/storage-permission.test.ts packages/browser-model-manager/test/uncached-browser.test.ts} &
          pid=$!
          (
            sleep "$WATCH"
            kill -0 "$pid" 2>/dev/null || exit 0
            echo "::group::watchdog after ${WATCH}s"
            ps -axo pid,ppid,etime,stat,command | grep -Ei 'node|webkit|playwright|MiniBrowser' | grep -v grep | cut -c1-400
            for p in $(pgrep -f 'node.*test\.ts'); do kill -USR2 "$p"; done
            sleep 5
            for f in "$reports"/*.json; do
              node -e 'const r=require(process.argv[1]);console.log("== report pid",r.header.processId,r.header.commandLine.slice(-1)[0]);console.log("js:",JSON.stringify(r.javascriptStack));for(const h of r.libuv)if(h.is_active)console.log("handle",h.type,h.localEndpoint?JSON.stringify(h.localEndpoint):"",h.remoteEndpoint?JSON.stringify(h.remoteEndpoint):"",h.pid??"")' "$f"
            done
            for p in $(pgrep -f 'Playwright.app/Contents/MacOS/Playwright|WebKit.WebContent|WebKit.Networking'); do
              echo "== sample $p $(ps -o command= -p $p | cut -c1-120)"
              sample "$p" 3 -mayDie -file "$reports/sample-$p.txt" >/dev/null 2>&1
              sed -n '/Sort by top of stack/,/Binary Images/p' "$reports/sample-$p.txt" | head -25
              grep -nE 'Thread_[0-9]+.*main-thread' -A60 "$reports/sample-$p.txt" | grep -vE '\?\?\?' | head -60
            done
            echo "::endgroup::"
            pkill -TERM -f "node.*test" || true
          ) &
          wait "$pid"
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: manager-macos-${{ inputs.engine }}-${{ matrix.run }}
          path: test-results/manager-cache/
          if-no-files-found: warn
          retention-days: 7
