name: web-shell
# apps/web (fm-svg): the declared browser matrix and the Vite targets derived from it, strict typecheck,
# unit tests, and the Vite production build of the app shell. Folds into the workspace gates once the
# scaffold (fm-fy2.4) lands.
permissions:
  contents: read
  actions: read
on:
  workflow_call:
    inputs:
      artifact_run:
        type: string
        required: true
        description: Canonical site workflow run ID
      artifact_workflow:
        type: string
        required: true
        description: Canonical site workflow file
      artifact_commit:
        type: string
        required: true
        description: Full canonical source commit
      artifact_name:
        type: string
        required: true
        description: Canonical site artifact name
  workflow_dispatch:
    inputs:
      artifact_run:
        type: string
        required: true
        description: Canonical site workflow run ID
      artifact_workflow:
        type: string
        required: true
        description: Canonical site workflow file
      artifact_commit:
        type: string
        required: true
        description: Full canonical source commit
      artifact_name:
        type: string
        required: true
        description: Canonical site artifact name
jobs:
  check:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      # apps/web imports the workspace packages through their built dist/ exports. Its format, lint, typecheck and unit
      # tests run once per main.yml run in scaffold's gates (fm-98po).
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
        working-directory: .
      - run: npm run build
      - run: npm run check:inventory
      - name: Every name the UI and the typed facade take from a bridge module is exported there (fm-pia9)
        run: node scripts/check-bridge-imports.mjs
  facade:
    runs-on: [self-hosted, eris]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - name: Typed facade through the real CPU bridge and the pinned runtime
        working-directory: apps/web
        env:
          FACEMORPH_REQUIRE_RUNTIME: '1'
        run: |
          export FACEMORPH_RUNTIME_DIR="$HOME/.cache/facemorph-device-lab/runtime-public"
          node --test --test-timeout=1200000 test/e2e/facade.e2e.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: facade-failure-${{ github.run_id }}
          path: apps/web/test-results/facade/
          if-no-files-found: ignore
  # The built shell in the Ubuntu 24.04 browser cells of apps/web/browser-matrix.json (Playwright Chromium,
  # Firefox and WebKit): control goldens at the shell rows, operated links at desktop and phone width (mouse
  # and touch), and every emitted worker loading. Screenshots are kept as an artifact.
  e2e:
    runs-on: ubuntu-24.04
    # About 4 minutes when healthy; a hung browser cell held the newest-only group for 4 hours (run 40094481824).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/setup-playwright # browsers cached per Playwright version (fm-98po)
        with:
          browsers: chromium firefox webkit
      - name: Verify the canonical site artifact
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: .cache/canonical-site
      - name: Use those exact bytes for shell and rendering fixtures
        working-directory: .
        run: |
          cp -R .cache/canonical-site/. .
          mkdir -p apps/web/dist
          cp -R deploy-next/. apps/web/dist/
      - run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The ubuntu-chrome cell (the runner's Google Chrome)
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACEMORPH_E2E_ENGINES: chromium
          FACEMORPH_E2E_CHROMIUM: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-e2e
          path: apps/web/test-results/
          if-no-files-found: ignore
