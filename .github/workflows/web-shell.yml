name: web-shell
# apps/web (fm-svg): the declared browser matrix and the Vite targets derived from it, strict typecheck,
# unit tests, and the Vite production build of the app shell. Folds into the workspace gates once the
# scaffold (fm-fy2.4) lands.
permissions:
  contents: read
  actions: read
on:
  workflow_call:
    inputs:
      artifact_run:
        type: string
        required: true
        description: Canonical site workflow run ID
      artifact_workflow:
        type: string
        required: true
        description: Canonical site workflow file
      artifact_commit:
        type: string
        required: true
        description: Full canonical source commit
      artifact_name:
        type: string
        required: true
        description: Canonical site artifact name
  workflow_dispatch:
    inputs:
      artifact_run:
        type: string
        required: true
        description: Canonical site workflow run ID
      artifact_workflow:
        type: string
        required: true
        description: Canonical site workflow file
      artifact_commit:
        type: string
        required: true
        description: Full canonical source commit
      artifact_name:
        type: string
        required: true
        description: Canonical site artifact name
jobs:
  check:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      # apps/web imports the workspace packages through their built dist/ exports. Its format, lint, typecheck and unit
      # tests run once per main.yml run in scaffold's gates (fm-98po).
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
        working-directory: .
      - run: npm run build
      - run: npm run check:inventory
      - name: Every name the UI and the typed facade take from a bridge module is exported there (fm-pia9)
        run: node scripts/check-bridge-imports.mjs
  facade:
    # Chromium CPU work uses the verified Ubuntu 24.04 temporary pool: linux-x64 also includes unsupported Triton 20.04.
    # Separate warm-state groups; keep two concurrent facade jobs on the shared 26-core host.
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ['1', '2', '3', '4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - uses: ./.github/actions/setup-runtime
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - name: Every facade declaration belongs to exactly one shard
        run: node --test apps/web/test/e2e/facade-shards.test.mjs
      - name: Typed facade through the real CPU bridge and the pinned runtime
        working-directory: apps/web
        env:
          FACEMORPH_REQUIRE_RUNTIME: '1'
          FACEMORPH_FACADE_SHARD: ${{ matrix.shard }}
        run: |
          node --test --test-timeout=1200000 test/e2e/facade.e2e.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: facade-failure-${{ github.run_id }}-${{ matrix.shard }}
          path: apps/web/test-results/facade/
          if-no-files-found: ignore
  # Full confirmed-crop/recovery acceptance on the same identified artifact (fm-d4mw).
  crop-acceptance:
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - uses: ./.github/actions/setup-runtime
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - name: Verify the canonical site artifact
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: .cache/canonical-site
      - name: Use those exact bytes as the identified artifact and the built shell
        run: |
          cp -R .cache/canonical-site/. .
          mkdir -p apps/web/dist
          cp -R deploy-next/. apps/web/dist/
      - name: Every confirmed-crop and recovery acceptance case with the pinned runtime
        working-directory: apps/web
        env:
          FACEMORPH_REQUIRE_RUNTIME: '1'
        run: node --test --test-timeout=7200000 test/e2e/crop-acceptance.e2e.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: crop-acceptance-failure-${{ github.run_id }}
          path: apps/web/test-results/crop-acceptance/
          if-no-files-found: ignore
  # The hosted e2e cells have no runtime and report these untested; here they run with the pinned runtime on the
  # same canonical artifact bytes: Encode (fm-fy2.17.1), composed tile controls and legacy links with real CPU
  # synthesis (fm-25um).
  runtime-e2e:
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - uses: ./.github/actions/setup-runtime
      # The e2e tests import app modules that read the engine package through its built dist/ exports (fm-7f2o).
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - name: Verify the canonical site artifact
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: .cache/canonical-site
      - name: Use those exact bytes as the identified artifact and the built shell
        run: |
          cp -R .cache/canonical-site/. .
          mkdir -p apps/web/dist
          cp -R deploy-next/. apps/web/dist/
      - name: Encode, result actions and morph controls with the pinned runtime
        working-directory: apps/web
        env:
          FACEMORPH_REQUIRE_RUNTIME: '1'
        run: |
          node --test --test-timeout=1200000 test/e2e/encode.e2e.ts test/e2e/face-controls.e2e.ts test/e2e/legacy-links.e2e.ts test/e2e/manifest-admission.e2e.ts test/e2e/export-files.e2e.ts test/e2e/result-actions.e2e.ts test/e2e/morph-output.e2e.ts test/e2e/opctl-trace.e2e.ts test/e2e/offline.e2e.ts test/e2e/still-entry.e2e.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-actions-${{ github.sha }}
          path: |
            apps/web/test-results/result-actions/report.json
            apps/web/test-results/result-actions/*.png
            apps/web/test-results/result-actions/*.webp
            apps/web/test-results/result-actions/*.mp4
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morph-output-${{ github.sha }}
          path: |
            apps/web/test-results/morph-output/*.json
            apps/web/test-results/morph-output/*.png
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-e2e-failure-${{ github.run_id }}
          path: |
            apps/web/test-results/encode/
            apps/web/test-results/face-controls/
            apps/web/test-results/legacy-links/
            apps/web/test-results/manifest-admission/
            apps/web/test-results/export-files/
            apps/web/test-results/result-actions/
            apps/web/test-results/morph-output/
            apps/web/test-results/opctl-trace/
            apps/web/test-results/offline/
            apps/web/test-results/still-entry/
          if-no-files-found: ignore
  # The built shell in the Ubuntu 24.04 browser cells of apps/web/browser-matrix.json (Playwright Chromium,
  # Firefox and WebKit): control goldens at the shell rows, operated links at desktop and phone width (mouse
  # and touch), and every emitted worker loading. Screenshots are kept as an artifact.
  e2e:
    # All three Playwright engines and genuine Google Chrome are installed on this Ubuntu pool.
    # Hosted dependency installation repeatedly exhausted the job before any tests ran (fm-jx26).
    runs-on: [self-hosted, tempcpu]
    # About 4 minutes when healthy; a hung browser cell held the newest-only group for 4 hours (run 40094481824).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/setup-playwright # browsers cached per Playwright version (fm-98po)
        with:
          browsers: chromium firefox webkit
      # facade and face-controls import app modules that read the engine package through its built dist/
      # exports; without it they fail to load (run 40290030872).
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
        working-directory: .
      - name: Verify the canonical site artifact
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: .cache/canonical-site
      - name: Use those exact bytes for shell and rendering fixtures
        working-directory: .
        run: |
          cp -R .cache/canonical-site/. .
          mkdir -p apps/web/dist
          cp -R deploy-next/. apps/web/dist/
      - name: Built-app Help and licence checks on the canonical bytes (fm-gbdt)
        run: node --test test/build/help-copy.test.ts
      - run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The ubuntu-chrome cell (the runner's Google Chrome)
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACEMORPH_E2E_ENGINES: chromium
          FACEMORPH_E2E_CHROMIUM: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-e2e
          path: apps/web/test-results/
          if-no-files-found: ignore
