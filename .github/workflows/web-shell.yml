name: web-shell
# apps/web (fm-svg): the declared browser matrix and the Vite targets derived from it, strict typecheck,
# unit tests, and the Vite production build of the app shell. Folds into the workspace gates once the
# scaffold (fm-fy2.4) lands.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, triton]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund # one lock for the workspace, at the root (fm-fy2.4)
        working-directory: .
      - run: npm run format:check # the workspace gates come before any build (fm-fy2.4)
        working-directory: .
      - run: npm run lint
        working-directory: .
      - run: npm run typecheck
      # apps/web's tests import the workspace packages through their built dist/ exports, as app-contracts does.
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
        working-directory: .
      - run: npm test
      - run: npm run build
      - run: npm run check:inventory
  # The built shell in the Ubuntu 24.04 browser cells of apps/web/browser-matrix.json (Playwright Chromium,
  # Firefox and WebKit): control goldens at the shell rows, operated links at desktop and phone width (mouse
  # and touch), and every emitted worker loading. Screenshots are kept as an artifact.
  e2e:
    runs-on: ubuntu-24.04
    # About 4 minutes when healthy; a hung browser cell held the newest-only group for 4 hours (run 40094481824).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund # one lock for the workspace, at the root (fm-fy2.4)
        working-directory: .
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: build:next (the pinned control, served by the verification harness's artifact fixture, fm-48bj)
        run: npm run build:next
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The ubuntu-chrome cell (the runner's Google Chrome)
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FACEMORPH_E2E_ENGINES: chromium
          FACEMORPH_E2E_CHROMIUM: /usr/bin/google-chrome
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-shell-e2e
          path: apps/web/test-results/
          if-no-files-found: ignore
