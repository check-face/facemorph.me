name: research-import
# The imported research tree (bead fm-86u): every file in docs/research-import/digest-list.json present with
# its SHA-256 and mode, results.tsv's snapshot bytes kept as its prefix, and no unlisted file in a frozen
# directory. Plus the import tooling's tests against real temporary Git repositories.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, triton]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/research-import/research-import.test.mjs
      - run: node scripts/check-research-import.mjs
