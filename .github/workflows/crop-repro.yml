name: crop-repro
# fm-f2rs: the crop-confirm loop cases (tests/crop/), run on the ported app: the identified build:next deploy-next/
# this job builds (fm-d4mw flipped the ui-* cases there). Every case must behave as tests/known-failing.json registers
# it: listed cases fail for the documented reason, the rest behave as intended. Also: fixture digests, and the
# test-only detector hook absent from the retained control and from the built site.
# The browser cases require the complete pinned runtime, verified by the shared portable acquisition step.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  crop:
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 120
    env:
      # The crop driver re-verifies the release after the initial fetch step.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - uses: ./.github/actions/setup-runtime
      - name: Browser controller for the crop cases
        run: |
          set -euo pipefail
          python_minor=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          venv="$RUNNER_TOOL_CACHE/python-playwright/1.56.0/python-$python_minor"
          if ! "$venv/bin/python" -c 'from importlib.metadata import version; assert version("playwright") == "1.56.0"' 2>/dev/null; then
            python3 -m venv "$venv"
            "$venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: playwright==1.56.0
          fi
          "$venv/bin/python" -m pip check
          echo "CROP_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(node -p 'require("playwright").chromium.executablePath()')" >> "$GITHUB_ENV"
      - run: node --test tests/crop/scan-test-hook.test.mjs
      - name: Fixtures match their recorded digests
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          d = pathlib.Path('tests/crop/fixtures'); m = json.loads((d / 'fixtures.json').read_text())
          for name, rec in m.items():
              if name.startswith('_'): continue
              data = (d / name).read_bytes()
              assert len(data) == rec['bytes'] and hashlib.sha256(data).hexdigest() == rec['sha256'], name
          print(len([k for k in m if not k.startswith('_')]), 'fixtures verified')
          PY
      - name: Fetch retained control independently
        run: node scripts/import/fetch-control.mjs --dest .cache/control
      # build:next's Vite build reads the workspace packages through their dist/ exports.
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - name: Build the ported app (the cases' subject)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:next && npm run build:next -- --check
      - name: Test-only detector hook absent from the built sites
        run: |
          node tests/crop/scan-test-hook.mjs .cache/control/tree/deploy-next
          node tests/crop/scan-test-hook.mjs deploy-next
      - name: Crop-confirm loop cases on the ported app (with a bounded runner)
        uses: ./.github/actions/run-command
        with:
          timeout: '2400'
          command: >-
            "$CROP_PYTHON" tests/crop/crop_confirm_loop.py --artifact ported --runtime "$FACEMORPH_RUNTIME_DIR"
            --out crop-evidence --chrome "$CHROMIUM_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crop-evidence-${{ github.run_id }}
          path: crop-evidence/
          retention-days: 30
          if-no-files-found: ignore
