name: crop-repro
# fm-f2rs: the crop-confirm loop cases (tests/crop/), run on the ported app: the identified build:next deploy-next/
# this job builds (fm-d4mw flipped the ui-* cases there). Every case must behave as tests/known-failing.json registers
# it: listed cases fail for the documented reason, the rest behave as intended. Also: fixture digests, and the
# test-only detector hook absent from the retained control and from the built site.
# The browser cases need the acquired runtime (model weights under import/licences.json). CI never accepts those
# terms itself: it uses a runtime already acquired on the runner by someone who did (verified, nothing downloaded),
# and records the browser cases as untested when there is none.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  crop:
    runs-on: [self-hosted, eris]
    timeout-minutes: 120
    env:
      # The crop driver re-verifies the release after the initial fetch step.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - run: node --test tests/crop/scan-test-hook.test.mjs
      - name: Fixtures match their recorded digests
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          d = pathlib.Path('tests/crop/fixtures'); m = json.loads((d / 'fixtures.json').read_text())
          for name, rec in m.items():
              if name.startswith('_'): continue
              data = (d / name).read_bytes()
              assert len(data) == rec['bytes'] and hashlib.sha256(data).hexdigest() == rec['sha256'], name
          print(len([k for k in m if not k.startswith('_')]), 'fixtures verified')
          PY
      - name: Fetch retained control independently
        run: node scripts/import/fetch-control.mjs --dest .cache/control
      # build:next's Vite build reads the workspace packages through their dist/ exports.
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - name: Build the ported app (the cases' subject)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:next && npm run build:next -- --check
      - name: Test-only detector hook absent from the built sites
        run: |
          node tests/crop/scan-test-hook.mjs .cache/control/tree/deploy-next
          node tests/crop/scan-test-hook.mjs deploy-next
      - name: Runtime already acquired on this runner (verified; nothing downloaded)
        id: runtime
        run: |
          dir="$HOME/.cache/facemorph-runtime"
          # The acquired tree must be exactly import/build-inputs.json runtime.assets (acquiredFindings needs no classic checkout).
          check='const [{acquiredFindings},{readJson,BUILD_INPUTS}]=await Promise.all([import("./scripts/inventory/check-build-inputs.mjs"),import("./scripts/inventory/lib.mjs")]);
            const {out,files}=acquiredFindings(process.argv[1],readJson(BUILD_INPUTS).runtime.assets);console.log(JSON.stringify({files,findings:out.length,first:out.slice(0,3)}));process.exit(out.length||!files?1:0);'
          if [ -f "$dir/manifest.json" ] && node --input-type=module -e "$check" "$dir"; then
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No verified runtime in $dir: the browser crop cases are untested in this run"
          fi
      - name: Browser controller for the crop cases
        if: steps.runtime.outputs.dir != ''
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q browser-harness==0.1.8 playwright==1.56.0
      - name: Crop-confirm loop cases on the ported app (with a bounded runner)
        if: steps.runtime.outputs.dir != ''
        uses: ./.github/actions/run-command
        with:
          timeout: '2400'
          command: >-
            "$RUNNER_TEMP/venv/bin/python" tests/crop/crop_confirm_loop.py --artifact ported --runtime "${{ steps.runtime.outputs.dir }}"
            --out crop-evidence --chrome "$(command -v chromium || command -v google-chrome)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crop-evidence-${{ github.run_id }}
          path: crop-evidence/
          retention-days: 30
          if-no-files-found: ignore
