name: hosted-lanes
run-name: hosted-${{ inputs.qualification_id || inputs.artifact_name }}
# fm-5klw: the device lab's journeys (cold face, warm face, morph to a playable video) on hosted
# platforms, against one exact artifact, each lane reporting the route it used
# (tools/device-lab/hosted.py): macOS WebKit/Firefox/Chrome, Windows Chrome/Edge, Chrome in the
# Android emulator and Safari in the iOS Simulator. Part of release validation with the device-lab
# cells (release-gate.yml). Its bounded supervisor distinguishes an unallocated
# hosted runner from executed failures; missing reports on executed jobs still fail.
on:
  workflow_dispatch:
    inputs:
      qualification_id:
        description: Correlates one bounded release attempt
        required: false
      artifact_source_repo_id:
        required: true
        description: Numeric source repository ID
      artifact_workflow:
        required: true
        description: Source workflow file
      artifact_commit:
        required: true
        description: Full source commit SHA
      artifact_run:
        description: Build run id
        required: true
      artifact_name:
        description: Its site artifact (contains deploy-next/)
        required: true
      runtime_sha:
        description: Runtime manifest SHA256 the artifact was qualified with
        default: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
  workflow_call:
    inputs:
      qualification_id:
        type: string
        required: false
      artifact_source_repo_id:
        type: string
        required: true
        description: Numeric source repository ID
      artifact_workflow:
        type: string
        required: true
        description: Source workflow file
      artifact_commit:
        type: string
        required: true
        description: Full source commit SHA
      artifact_run:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      runtime_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-lanes-${{ inputs.artifact_name }}
  cancel-in-progress: false
env:
  LANES: macos-webkit,macos-firefox,macos-chrome,windows-chrome,windows-msedge,android-emulator-chrome,ios-simulator-safari
jobs:
  desktop:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, browser: webkit, lane: macos-webkit, install: webkit }
          - { os: macos-15, browser: firefox, lane: macos-firefox, install: firefox }
          - { os: macos-15, browser: chrome, lane: macos-chrome, install: '' }
          - { os: windows-latest, browser: chrome, lane: windows-chrome, install: '' }
          - { os: windows-latest, browser: msedge, lane: windows-msedge, install: '' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ inputs.artifact_source_repo_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --upgrade playwright
      - if: matrix.install != ''
        run: python -m playwright install --with-deps ${{ matrix.install }}
      - name: Manager component dependencies on macOS
        if: matrix.browser == 'webkit' || matrix.browser == 'firefox'
        uses: ./.github/actions/setup-workspace
      - name: Build manager components on macOS
        if: matrix.browser == 'webkit' || matrix.browser == 'firefox'
        run: |
          npm run build -w packages/stylegan-js -w packages/browser-model-manager
          npx playwright install ${{ matrix.browser }}
      - name: Native manager components on ${{ matrix.lane }}
        if: matrix.browser == 'webkit' || matrix.browser == 'firefox'
        uses: ./.github/actions/run-command
        env:
          FACEMORPH_MANAGER_ENGINE: ${{ matrix.browser }}
          FACEMORPH_REQUIRE_MANAGER_BROWSER: '1'
          FACEMORPH_ISOLATE_TEST_NETWORK: '0'
        with:
          timeout: '900'
          # The Linux-only netlink namespace wrapper stays disabled on these macOS runners.
          command: node packages/browser-model-manager/test/run.mjs --test-concurrency=1 packages/browser-model-manager/test/cache-local.test.ts packages/browser-model-manager/test/handles-tabs.test.ts packages/browser-model-manager/test/acquisition.test.ts packages/browser-model-manager/test/acquisition-deadline.test.ts packages/browser-model-manager/test/slots-browser.test.ts packages/browser-model-manager/test/worker-storage.test.ts packages/browser-model-manager/test/storage-permission.test.ts packages/browser-model-manager/test/uncached-browser.test.ts
      - name: Loaded manager CPU handle lifecycle on ${{ matrix.lane }}
        if: matrix.browser == 'webkit' || matrix.browser == 'firefox'
        uses: ./.github/actions/run-command
        env:
          ACCEPT_MODEL_TERMS: 'yes'
          FACEMORPH_MANAGER_ENGINE: ${{ matrix.browser }}
          FACEMORPH_REQUIRE_MANAGER_BROWSER: '1'
          FACEMORPH_REQUIRE_RUNTIME: '1'
          FACEMORPH_RUNTIME_CACHE: ${{ runner.temp }}/manager-loaded-runtime
        with:
          timeout: '600'
          command: |
            node packages/browser-model-manager/test/support/acquire-loaded-runtime.mjs "$FACEMORPH_RUNTIME_CACHE"
            node packages/browser-model-manager/test/run.mjs packages/browser-model-manager/test/loaded-browser.component.ts
      - name: Journeys on ${{ matrix.lane }}
        working-directory: tools/device-lab
        run: python hosted.py browser --lane ${{ matrix.lane }} --browser ${{ matrix.browser }} --artifact ../../artifact/deploy-next --runtime-sha ${{ inputs.runtime_sha }} --out ../../lane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-${{ matrix.lane }}
          path: |
            lane/*.json
            lane/*.png
            lane/*.zip
            test-results/manager-cache/
          if-no-files-found: warn
          retention-days: 30
  android:
    name: android-emulator-chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ inputs.artifact_source_repo_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --upgrade playwright
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Journeys in Chrome on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 8192M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: tools/device-lab
          script: python hosted.py android --lane android-emulator-chrome --artifact ../../artifact/deploy-next --runtime-sha ${{ inputs.runtime_sha }} --out ../../lane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-android-emulator-chrome
          path: |
            lane/*.json
            lane/*.png
          if-no-files-found: warn
          retention-days: 30
  ios:
    name: ios-simulator-safari
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ inputs.artifact_source_repo_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Journeys in Safari on the iOS Simulator
        working-directory: tools/device-lab
        run: python hosted.py ios --lane ios-simulator-safari --device 'iPhone 16 Pro' --artifact ../../artifact/deploy-next --runtime-sha ${{ inputs.runtime_sha }} --out ../../lane
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lane-ios-simulator-safari
          path: |
            lane/*.json
            lane/*.png
          if-no-files-found: warn
          retention-days: 30
  summary:
    needs: [desktop, android, ios]
    if: always()
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lane-*
          path: lanes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One row per lane; a failed or missing lane fails this job
        shell: bash # bash -eo pipefail: without it `| tee` hides the summary's exit status
        run: python tools/device-lab/hosted.py summary lanes --expect "$LANES" | tee -a "$GITHUB_STEP_SUMMARY"
