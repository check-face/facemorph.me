# THROWAWAY (fm-bbhu): cropper basis comparison. Deleted with spikes/cropper/ once the basis is chosen.
name: cropper-spike

on:
  push:
    branches: [main]
    paths:
      - 'spikes/cropper/**'
      - '.github/workflows/cropper-spike.yml'
  workflow_dispatch:

concurrency:
  group: cropper-spike
  cancel-in-progress: false

jobs:
  spike:
    runs-on: [self-hosted, eris]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spikes/cropper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install (lockfile)
        run: npm ci
      - name: Build both prototypes
        run: npm run build
      - name: Browser tests (real Chromium, Firefox, WebKit)
        run: npm test
      - name: Geometry comparison with the locked reference
        run: node compare-geometry.mjs ../../docs/design/legacy-encode-dialog-geometry.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cropper-spike-out
          path: spikes/cropper/out/
          retention-days: 30
