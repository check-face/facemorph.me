name: diagnostics-retention
# The old-wording report deletion and the learnings-note scan (bead fm-xgww, scripts/diagnostics/): every
# precondition stop, the repeat path, post-checks and the working-copy scan against a real S3-compatible
# store (SeaweedFS in Docker, data on tmpfs) and real temporary Git repositories with a bare remote.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    # Real S3 integration needs Docker; the tempcpu portable runners do not provide it.
    runs-on: [self-hosted, eris-build]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts/diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
        with:
          directory: scripts/diagnostics
      # The working-copy scan uses ripgrep; the runner has none, so install the pinned release, checksum verified.
      - name: Install ripgrep 14.1.1
        working-directory: .
        run: |
          curl -fsSLo rg.tgz https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  rg.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rg" && tar -xzf rg.tgz -C "$RUNNER_TEMP/rg" --strip-components=1 && rm rg.tgz
          echo "$RUNNER_TEMP/rg" >> "$GITHUB_PATH"
      # The S3 tests skip without Docker; here that must fail instead.
      - run: docker info --format '{{.ServerVersion}}'
      # Includes receipt.test.mjs: the receipt and the learnings note carry no key, run ID or token value.
      - run: node --test delete-old-wording-reports.test.mjs scan-learnings-note.test.mjs receipt.test.mjs
