name: manager-mobile
# Native package components only. This does not qualify a deployed product artifact.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native mobile component lane
        type: choice
        options: [both, android, ios]
        default: both
permissions:
  contents: read
jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - run: python3 -m unittest discover -s apps/web/tests/mobile -p 'test_*.py'
      - name: Acquire pinned CPU component inputs
        env:
          ACCEPT_MODEL_TERMS: 'yes'
        run: node packages/browser-model-manager/test/support/acquire-loaded-runtime.mjs "$RUNNER_TEMP/manager-loaded-runtime"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native manager components in Android Chrome
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 apps/web/tests/mobile/run.py --platform android --runtime "$RUNNER_TEMP/manager-loaded-runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-mobile-android-${{ github.run_id }}
          path: apps/web/mobile-evidence/
          if-no-files-found: warn
  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - run: python3 -m unittest discover -s apps/web/tests/mobile -p 'test_*.py'
      - name: Acquire pinned CPU component inputs
        env:
          ACCEPT_MODEL_TERMS: 'yes'
        run: node packages/browser-model-manager/test/support/acquire-loaded-runtime.mjs "$RUNNER_TEMP/manager-loaded-runtime"
      - name: Native manager components in iOS Simulator Safari
        run: python3 apps/web/tests/mobile/run.py --platform ios --runtime "$RUNNER_TEMP/manager-loaded-runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-mobile-ios-${{ github.run_id }}
          path: apps/web/mobile-evidence/
          if-no-files-found: warn
