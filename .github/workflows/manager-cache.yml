name: manager-cache
# fm-eulc: the model cache in browser-model-manager. In the qualified temporary browser pool: the
# package's typecheck, build and tests, whose browser cases run verified local reads on OPFS and Cache Storage
# (typed miss, corruption, eviction; zero requests counted by host class with the interception helper; entries the
# candidate's own cache wrote read without a download), the tarball check, and the candidate's carried
# model-cache.test.mjs through the shim at its old path. On triton (scaffold) the browser cases report untested.
on:
  workflow_call:
    inputs:
      shared_build:
        type: boolean
        default: false
        description: Reuse the exact compiled workspace from this main run
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache:
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    env:
      FACEMORPH_MANAGER_ENGINE: ${{ matrix.engine }}
      FACEMORPH_REQUIRE_MANAGER_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/restore-workspace-build
        if: inputs.shared_build
      - uses: ./.github/actions/setup-runtime
      - name: Install the selected real browser
        run: npx playwright install ${{ matrix.engine }}
      - if: ${{ !inputs.shared_build }}
        run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - name: Full package once; engine-specific components in every selected browser
        uses: ./.github/actions/run-command
        env:
          FACEMORPH_ISOLATE_TEST_NETWORK: '1'
          # Disposable component profiles exercise native storage APIs, not disk throughput. Keep their
          # I/O separate from concurrent Docker/model builds; the cold-photo storage measurement stays below.
          TMPDIR: /dev/shm
        with:
          timeout: '900'
          # Run browser files serially: their workers already exercise real concurrency without competing
          # with seven other browser startups/OPFS profiles on this runner. Keep every cell and deadline.
          # Every test origin is local. Isolate netlink notifications from concurrent Docker jobs:
          # veth address changes otherwise abort Chromium's localhost module fetches.
          command: |
            if [ "$FACEMORPH_MANAGER_ENGINE" = chromium ]; then
              npm test -w packages/browser-model-manager -- --test-concurrency=1
            else
              # Other package files run Node ORT or explicitly launch Chromium, independent
              # of this matrix value. Keep those in the full suite, without repeating them.
              node packages/browser-model-manager/test/run.mjs --test-concurrency=1 packages/browser-model-manager/test/cache-local.test.ts packages/browser-model-manager/test/handles-tabs.test.ts packages/browser-model-manager/test/acquisition.test.ts packages/browser-model-manager/test/acquisition-deadline.test.ts packages/browser-model-manager/test/slots-browser.test.ts packages/browser-model-manager/test/worker-storage.test.ts packages/browser-model-manager/test/storage-permission.test.ts packages/browser-model-manager/test/uncached-browser.test.ts
            fi
      - name: Candidate cache shim and worker source regressions
        working-directory: apps/web
        run: node --test src/Next/Assets/model-cache.test.mjs src/Next/browser/model-source.test.mjs
      - name: Cold photo with the real 108-shard encoder
        if: matrix.engine == 'chromium'
        uses: ./.github/actions/run-command
        env:
          FACEMORPH_ISOLATE_TEST_NETWORK: '1'
          FACEMORPH_REQUIRE_RUNTIME: '1'
        with:
          timeout: '360'
          # Keep the 1 GiB cold acquisition out of the concurrent package timing cells.
          command: |
            export FACEMORPH_RUNTIME_CACHE="$FACEMORPH_RUNTIME_DIR"
            node packages/browser-model-manager/test/run.mjs packages/browser-model-manager/test/cold-photo.component.ts
      - name: Loaded CPU handle release and native leased-file loss
        uses: ./.github/actions/run-command
        env:
          FACEMORPH_ISOLATE_TEST_NETWORK: '1'
          FACEMORPH_REQUIRE_RUNTIME: '1'
        with:
          timeout: '360'
          command: |
            export FACEMORPH_RUNTIME_CACHE="$FACEMORPH_RUNTIME_DIR"
            node packages/browser-model-manager/test/run.mjs packages/browser-model-manager/test/loaded-browser.component.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-loaded-${{ matrix.engine }}-${{ github.run_id }}
          path: test-results/manager-cache/${{ matrix.engine }}/loaded-browser*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && matrix.engine == 'chromium'
        with:
          name: manager-cold-photo-${{ github.run_id }}
          path: test-results/manager-cache/chromium/cold-photo/result.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: manager-cache-${{ matrix.engine }}-${{ github.run_id }}
          path: test-results/manager-cache/
          if-no-files-found: ignore
