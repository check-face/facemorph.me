name: manager-cache
# fm-eulc: the model cache in @facemorph/browser-model-manager. On eris (Playwright's Chromium is there): the
# package's typecheck, build and tests, whose browser cases run verified local reads on OPFS and Cache Storage
# (typed miss, corruption, eviction; zero requests counted by host class with the interception helper; entries the
# candidate's own cache wrote read without a download), the tarball check, and the candidate's carried
# model-cache.test.mjs through the shim at its old path. On triton (scaffold) the browser cases report untested.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache:
    runs-on: [self-hosted, eris]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - run: npm run typecheck -w packages/browser-model-manager
      - name: Package tests (browser cases in real Chromium), under the eris device lease
        uses: ./.github/actions/device-lease
        with:
          device: eris
          lane: browser-cpu
          timeout: '900'
          wait: '1800'
          command: npm test -w packages/browser-model-manager
      - name: The candidate's model-cache.test.mjs through the shim, expectations unchanged
        working-directory: apps/web
        run: node --test src/Next/Assets/model-cache.test.mjs
