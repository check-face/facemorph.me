name: Dependency policy rejection probe
# Deliberately red dry runs of the production gates. These synthetic Git commits
# have no published ref or PR, and this workflow has no merge/write permission.
on:
  workflow_dispatch:
    inputs:
      violation:
        description: Prohibited change to reject alongside a synthetic build-tools bump
        type: choice
        required: true
        options: [tolerance, cell]
permissions:
  contents: read
jobs:
  reject:
    if: github.ref == 'refs/heads/main'
    name: Reject ${{ inputs.violation }} change
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - name: Run the exact policy gates against the unpublished candidate
        env:
          PROBE_CASE: ${{ inputs.violation }}
        run: |
          node scripts/ci/dependency-policy-probe.ts --case "$PROBE_CASE" \
            --out "$RUNNER_TEMP/dependency-policy-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-policy-rejection-${{ inputs.violation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency-policy-probe-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
