name: identity-check
# fm-a4b (identity.map): tests for the read-only identity reader and the org-link scan. The reader
# makes real `gh api` (workflow token: admin-only settings come back unverified, never as drift),
# `git ls-remote` and `curl` reads; the scan reads fresh shallow clones of the four sibling
# repositories at the revisions named in scripts/identity/org-link-rules.json, plus this checkout.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    # Browser-free commands qualified with the pinned gh version on Triton (fm-jx26).
    runs-on: [self-hosted, triton]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install gh (pinned, checksum-verified)
        run: |
          set -euo pipefail
          v=2.101.0
          d="$RUNNER_TEMP/gh"
          cache="${RUNNER_TOOL_CACHE:?}/gh/$v/linux_amd64"
          mkdir -p "$cache" "$d"
          # Runner-local archives are always checked before reuse; concurrent jobs share one download.
          exec 9>"$cache/.lock"
          flock --wait 180 9
          cd "$cache"
          archive="gh_${v}_linux_amd64.tar.gz"
          checksums="gh_${v}_checksums.txt"
          if ! { test -s "$archive" && test -s "$checksums" && grep " $archive\$" "$checksums" | sha256sum -c -; }; then
            stage=$(mktemp -d "$RUNNER_TEMP/gh-download.XXXXXX")
            trap 'rm -rf -- "$stage"' EXIT
            (
              cd "$stage"
              curl --retry 3 --retry-delay 1 --retry-max-time 120 --connect-timeout 10 --max-time 60 -fsSLO "https://github.com/cli/cli/releases/download/v$v/$archive"
              curl --retry 3 --retry-delay 1 --retry-max-time 120 --connect-timeout 10 --max-time 60 -fsSLO "https://github.com/cli/cli/releases/download/v$v/$checksums"
              grep " $archive\$" "$checksums" | sha256sum -c -
              mv "$archive" "$checksums" "$cache/"
            )
          fi
          tar -xzf "$archive" -C "$d"
          "$d/gh_${v}_linux_amd64/bin/gh" --version
          echo "$d/gh_${v}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Clone the sibling repositories
        run: |
          ws="$RUNNER_TEMP/ws"
          mkdir -p "$ws"
          ln -s "$GITHUB_WORKSPACE" "$ws/facemorph.me"
          for r in facemorph.me-classic facemorph-names checkface encoder4editing; do
            git clone -q --depth 1 --no-single-branch "https://github.com/facemorph-me/$r.git" "$ws/$r"
          done
      - name: Tests
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY_SCAN_ROOT: ${{ runner.temp }}/ws
        run: node --test scripts/identity/read-identity.test.mjs scripts/identity/scan-org-links.test.mjs
