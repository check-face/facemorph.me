name: contracts-m1
# Contracts milestone 1 (fm-hwh): both packages' contracts type-checked without DOM/Node globals,
# the type-level and unit tests, validator fuzzing (manifest here; recovery metadata and worker
# payloads in stylegan-js's suite, same job), the manifest JSON schema against the candidate's
# recorded runtime manifest, and an external consumer compiling the packed packages' declarations.
on:
  workflow_call:
    inputs:
      shared_build:
        type: boolean
        default: false
        description: Reuse the exact compiled workspace from this main run
      full:
        type: boolean
        default: true
        description: Include multi-minute engine inference journeys in mandatory pre-deploy qualification
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/restore-workspace-build
        if: inputs.shared_build
      - if: '!inputs.shared_build'
        run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - run: npx tsc -p packages/stylegan-js/tsconfig.json && npx tsc -p packages/stylegan-js/tsconfig.test.json
      - run: npx tsc -p packages/browser-model-manager/src/contracts/tsconfig.test.json
      # Full qualification must execute the model journeys, never rely on ambient runner caches.
      - uses: ./.github/actions/setup-playwright
        if: github.event_name == 'workflow_dispatch' || inputs.full
        with:
          browsers: chromium firefox webkit
      - uses: ./.github/actions/setup-runtime
        if: github.event_name == 'workflow_dispatch' || inputs.full
      - name: Bind model tests to the verified runtime and require all encoder canaries
        if: github.event_name == 'workflow_dispatch' || inputs.full
        run: |
          test -n "$FACEMORPH_RUNTIME_DIR"
          runtime_sha=$(sha256sum "$FACEMORPH_RUNTIME_DIR/manifest.json" | cut -c1-64)
          echo "FACEMORPH_RUNTIME_CACHE=$FACEMORPH_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "FACEMORPH_RUNTIME_SHA256=$runtime_sha" >> "$GITHUB_ENV"
          echo 'FACEMORPH_FULL_QUALIFY=1' >> "$GITHUB_ENV"
      - name: Engine contract tests (incl. recovery-metadata and worker-payload fuzz)
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.full }}
        run: |
          args=(--workspace packages/stylegan-js)
          if [ "$FULL" != true ]; then args+=(--quick); fi
          node scripts/ci/scaffold-test-shards.mjs "${args[@]}"
      - name: Manager contract tests (incl. manifest fuzz)
        working-directory: packages/browser-model-manager
        run: node --test test/contracts-*.test.ts
      - name: Manifest schema against the recorded candidate manifest; a newer major is rejected
        run: |
          set -euo pipefail
          s=packages/browser-model-manager/schema/model-manifest.v1.schema.json
          f=packages/browser-model-manager/test/fixtures
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s "$s" -d "$f/candidate-runtime-manifest.json"
          if npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s "$s" -d "$f/newer-major-manifest.json"; then echo 'newer major accepted'; exit 1; fi
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s "$s" -d "$f/model-conv-build-manifest.json"
      - name: External consumer against the packed declarations
        run: node tests/external-consumer/run.mjs
  # stylegan-js recovery helpers in real browsers (fm-1muu): Chromium, Firefox and WebKit decode the PNG and
  # lossless WebP writers' output to the exact pixels, every inspectStill kind matches, and inspection makes
  # no network request (all requests intercepted; only the package's module files are served).
  browsers:
    # All three native browsers are verified in this pool; linux-x64 also includes unsupported Ubuntu 20.04.
    # Reuse the installed browsers and system libraries instead of repeating hosted apt/download setup.
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/restore-workspace-build
        if: inputs.shared_build
      - uses: ./.github/actions/setup-playwright # browsers cached per Playwright version (fm-98po)
        with:
          browsers: chromium firefox webkit
      - if: ${{ !inputs.shared_build }}
        run: npm run build -w packages/stylegan-js
      - run: node packages/stylegan-js/test/browser/media-browsers.mjs
      - run: node packages/stylegan-js/test/browser/webp-lossless-browsers.mjs
      - run: node packages/stylegan-js/test/browser/crop-policy-browsers.mjs
