name: device-lab
# Two cells of the same end-to-end journeys (tools/device-lab/lab.py): eris-webgpu, eris-cpu
# (desktop Chromium on eris, RTX 2080 SUPER). Runs on the self-hosted runner `eris-device-lab` only.
# The physical phone (USB P30 Pro) never runs in CI (operator, 25 October 2026): agents run
# `lab.py matrix` locally against candidate builds during development, and against the deployed
# release at handover (fm-s3o).
#
# - On demand: agents (or the operator) dispatch it when a run is useful; no schedule.
# - Best effort: release validation and post-deploy checks may call it (workflow_call); it never gates
#   a deploy or new work on device availability (operator, 24 October 2026).
# Triggers are push-free on purpose: no pull_request, so fork code never reaches eris.
on:
  workflow_dispatch:
    inputs:
      artifact_source_repo_id:
        required: false
        description: Numeric source repository ID
      artifact_workflow:
        required: false
        description: Source workflow file
      artifact_commit:
        required: false
        description: Full source commit SHA
      url:
        description: Site to test (ignored when an artifact is given)
        default: https://next.facemorph.me/
      cells:
        description: Comma-separated cells
        default: eris-webgpu,eris-cpu
      journey:
        description: Journeys
        default: cold-face,warm-face,morph
      artifact_run:
        description: Optional - a candidate build's run id in facemorph.me-classic, to test that exact build before it deploys
        default: ''
      artifact_name:
        description: Optional - its next-site-<sha> artifact name
        default: ''
      runtime_sha:
        description: Runtime manifest SHA256 for an artifact run
        default: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
  workflow_call:
    inputs:
      artifact_source_repo_id:
        type: string
        required: false
        description: Numeric source repository ID
      artifact_workflow:
        type: string
        required: false
        description: Source workflow file
      artifact_commit:
        type: string
        required: false
        description: Full source commit SHA
      artifact_run:
        type: string
        default: ''
      artifact_name:
        type: string
        default: ''
      runtime_sha:
        type: string
        default: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
      url:
        type: string
        default: https://next.facemorph.me/
      label:
        type: string
        default: ''
      cells:
        type: string
        default: eris-webgpu,eris-cpu
      journey:
        type: string
        default: cold-face,warm-face,morph
permissions:
  contents: read
  actions: read
concurrency:
  group: device-lab
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: [self-hosted, device-lab]
    timeout-minutes: 120
    steps:
      - name: Check out the device lab
        uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the exact candidate artifact
        if: inputs.artifact_name != ''
        uses: ./lab/.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ inputs.artifact_source_repo_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: artifact
      - name: Preflight
        working-directory: lab/tools/device-lab
        run: uv run --quiet --with playwright python lab.py preflight
      - name: Run the matrix
        working-directory: lab/tools/device-lab
        env:
          FACEMORPH_CHECKOUT: ${{ github.workspace }}/lab
          LABEL: ${{ inputs.label || (inputs.artifact_name != '' && format('gate-{0}', inputs.artifact_name)) || 'on-demand' }}
          URL: ${{ inputs.url || 'https://next.facemorph.me/' }}
          CELLS: ${{ inputs.cells || 'eris-webgpu,eris-cpu' }}
          JOURNEY: ${{ inputs.journey || 'cold-face,warm-face,morph' }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          set -euo pipefail
          export RUNTIME_FILES="$HOME/.cache/facemorph-device-lab/runtime-public"
          if [ -n "$ARTIFACT_NAME" ]; then
            # Keep the runtime mirror between runs; the server keys it by each asset's sha256.
            mkdir -p "$HOME/.cache/facemorph-device-lab/runtime-mirror"
            ln -sfn "$HOME/.cache/facemorph-device-lab/runtime-mirror" "$GITHUB_WORKSPACE/artifact/.runtime-mirror"
            uv run --quiet --with playwright python lab.py matrix --artifact "$GITHUB_WORKSPACE/artifact" \
              --runtime-sha "$RUNTIME_SHA" --cells "$CELLS" --journey "$JOURNEY" --label "$LABEL"
          else
            uv run --quiet --with playwright python lab.py matrix --url "$URL" --cells "$CELLS" --journey "$JOURNEY" --label "$LABEL"
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lab/tools/device-lab/out/*/summary.*
            lab/tools/device-lab/out/*/*.json
            lab/tools/device-lab/out/*/*.png
            lab/tools/device-lab/out/*/server.log
          retention-days: 30
          if-no-files-found: warn
      - name: Leave the devices in their resting state
        if: always()
        working-directory: lab/tools/device-lab
        run: uv run --quiet --with playwright python lab.py recover || true
