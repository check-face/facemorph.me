name: Exact new-site qualification
# fm-aa8: classic's next-e2e.yml carried over (job real-ui-cpu). Qualification is bound to one exact artifact named
# by its run and name; there is no fallback artifact. In the qualified CPU pool: the verified acquired runtime (its manifest must
# be the pinned runtime_sha, refused before any browser starts), the artifact served at https://next.facemorph.me by
# classic's qualification server (apps/web/scripts/next-e2e-server.py through the parity specs' control server),
# classic's journey (apps/web/scripts/next-e2e-browser.py, unedited) in pinned Chrome for Testing under
# browser-harness 0.1.8 with a 1500 s watchdog, and the network recorded by a second CDP client by host class:
# zero third-party requests (GA4's approved loader is 'analytics' and must move zero bytes), plus real inference
# events for every generated face and the e4e encode (scripts/ci/site/real-ui-cpu.mjs). Port 8443 and the CPU work run under
# bounded process cleanup.
on:
  workflow_call:
    inputs:
      artifact_run:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      runtime_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Successful New site artifact workflow run ID
        required: true
      artifact_name:
        description: Exact next-site-<source SHA> artifact name from that run
        required: true
      runtime_sha:
        description: Public runtime manifest SHA256 (fails closed if changed)
        required: true
        default: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
permissions:
  contents: read
  actions: read
jobs:
  real-ui-cpu:
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/setup-browser-harness
      - uses: ./.github/actions/setup-runtime
      - name: Validate artifact run provenance
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run }}
          THIS_RUN: ${{ github.run_id }}
          ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT" =~ ^next-site-[a-f0-9]{40}$ ]]
          gh api "repositories/${{ github.repository_id }}/actions/runs/$RUN_ID" > source-run.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('source-run.json'))
          same_run = os.environ['RUN_ID'] == os.environ.get('THIS_RUN', '')
          # next-site.yml builds the artifact; on main it runs inside the one pipeline, main.yml (fm-98po).
          workflow = r['path'].split('@')[0]
          assert workflow in ('.github/workflows/next-site.yml', '.github/workflows/main.yml'), r['path']
          assert r['conclusion'] == 'success' or same_run, 'Qualify a finished artifact build, or the one calling this workflow'
          assert r['event'] in ('push', 'workflow_dispatch'), 'Use a branch build; PR merge artifact provenance needs a separate merge-SHA receipt'
          assert os.environ['ARTIFACT'] == 'next-site-' + r['head_sha']
          open(os.environ['GITHUB_OUTPUT'], 'a').write('commit=' + r['head_sha'] + '\nworkflow=' + workflow + '\n')
          PY
      - name: Fetch the exact artifact by explicit provenance
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: ${{ steps.source.outputs.workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ steps.source.outputs.commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: site
      - name: Verify exact artifact
        run: |
          set -euo pipefail
          mkdir -p next-e2e-evidence
          (cd site && sha256sum --quiet --check next-site-SHA256SUMS)
          python3 apps/web/scripts/verify-web-artifact.py --artifact site --revision "$(cat site/next-site-source.txt)" --receipt next-e2e-evidence/next-web-verification.json
          cp site/next-site-source.txt site/next-site-SHA256SUMS source-run.json next-e2e-evidence/
      # Chrome for Testing, pinned and cached on the runner: the journey plays and saves an H.264 MP4, which Arch's
      # Chromium cannot decode (classic ran Google Chrome on ubuntu-24.04).
      - name: Pinned Chrome for Testing
        id: chrome
        env:
          CHROME_VERSION: '141.0.7390.54'
        run: |
          set -euo pipefail
          root="$RUNNER_TOOL_CACHE/chrome-for-testing/$CHROME_VERSION"
          binary="$root/chrome-linux64/chrome"
          if [ ! -x "$binary" ]; then
            mkdir -p "$root"
            curl -fsSL -o "$root/chrome.zip" "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
            unzip -q -o "$root/chrome.zip" -d "$root"
            rm -f "$root/chrome.zip"
          fi
          "$binary" --version
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - name: Run real production UI CPU workflow (bounded command)
        uses: ./.github/actions/run-command
        with:
          timeout: '2400'
          command: >-
            CHROMIUM_PATH="${{ steps.chrome.outputs.binary }}" node scripts/ci/site/real-ui-cpu.mjs --site site --runtime-sha "${{ inputs.runtime_sha }}"
            --runtime "$FACEMORPH_RUNTIME_DIR" --out next-e2e-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-e2e-${{ github.run_id }}
          path: next-e2e-evidence/
          retention-days: 14
          if-no-files-found: error
