name: import-inventory
# fm-fy2.1: the import-input inventory checked against classic's Git objects at the frozen commit
# (import/allowlist.json source.frozen_commit): digests regenerated from git archive, rule classification
# and reviewed delta, the exclusion scan, unresolved imports, build inputs and licence coverage.
on:
  push:
    branches: [main]
    paths: ['import/**', 'scripts/inventory/**', '.github/workflows/import-inventory.yml']
  workflow_dispatch:
concurrency:
  group: import-inventory
  cancel-in-progress: false
jobs:
  checks:
    runs-on: [self-hosted, triton]
    steps:
      - uses: actions/checkout@v4
      - name: Classic at the frozen commit, with history back to the planning reference (read-only)
        uses: actions/checkout@v4
        with:
          repository: check-face/facemorph.me-classic
          ref: a42829bb0582b5a7a55ba6b1045a05861612b8a5
          path: classic
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The checkout is the allowlist's frozen commit
        run: test "$(node -p "require('./import/allowlist.json').source.frozen_commit")" = "$(git -C classic rev-parse HEAD)"
      - run: node --test scripts/inventory/lib.test.mjs
      - run: node scripts/inventory/allowlist-digests.mjs --classic classic
      - run: node scripts/inventory/generate-allowlist.mjs --check --classic classic
      - run: node scripts/inventory/scan-allowlist.mjs --classic classic
      - run: node scripts/inventory/unresolved-imports.mjs --classic classic
      - run: node scripts/inventory/check-build-inputs.mjs --classic classic
