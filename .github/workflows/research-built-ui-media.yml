name: research-built-ui-media
# fm-qqh: re-homed from classic's research-built-ui-media-v1.yml onto the maintained built-UI paired driver
# (autoresearch/drivers/built-ui-paired.mjs). Experimental: bounded, separate from product checks, never a required
# status. A push touching the app, the packages, the maintained research code or scripts runs a measured smoke against
# the pinned control artifact on eris; workflow_dispatch can run the full paired screen. Outputs land in eris's
# durable research directory (named in autoresearch/workers/eris/README.md); the uploaded artifact is only a copy.
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        description: 'smoke (one sample per side) or paired (warmup + ABBA x3; refuses load above 4)'
      candidate_run_id:
        type: string
        required: false
        description: 'main.yml run whose next-site lane built the candidate artifact (empty: control/control)'
      candidate_commit:
        type: string
        required: false
        description: Full commit SHA that run built (artifact next-site-<commit>)
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (one sample per side) or paired (warmup + ABBA x3; refuses load above 4)
        type: choice
        options: [smoke, paired]
        default: smoke
      candidate_run_id:
        description: main.yml run whose next-site lane built the candidate artifact (empty runs control/control)
        required: false
        default: ''
      candidate_commit:
        description: Full commit SHA that run built (artifact next-site-<commit>)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, eris]
    timeout-minutes: 105 # covers setup, a 1800 s timing-lock wait, the 3600 s command and cleanup
    env:
      LABEL: ci-built-ui-${{ github.run_id }}-${{ github.run_attempt }}
      OUT: /home/cdilga/Work/runs/facemorph-research
      RUNTIME: /home/cdilga/.cache/facemorph-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - name: Driver tests
        run: node --test autoresearch/drivers/drivers.test.mjs
      # A candidate is located only through the shared lookup action: this repository's ID, the run, its commit
      # and artifact next-site-<commit>, digest-verified file by file (fm-7ge, fm-qqh). Without one the run is
      # control/control.
      - name: Fetch the candidate artifact through the shared lookup
        id: candidate
        if: inputs.candidate_run_id != ''
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: '1413979666'
          workflow: .github/workflows/main.yml
          run_id: ${{ inputs.candidate_run_id }}
          commit: ${{ inputs.candidate_commit }}
          artifact_name: next-site-${{ inputs.candidate_commit }}
          out: .cache/candidate
      - name: Fetch retained control independently (digest re-verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/import/fetch-control.mjs --dest .cache/control
      - name: Worker readiness
        run: node autoresearch/workers/check.mjs --lane browser-cpu --smoke --runtime "$RUNTIME"
      - name: Exclusive built-UI timing against the control artifact
        uses: ./.github/actions/run-command
        with:
          exclusive: gpu-timing # times the GPU: alone among timing jobs, never blocking others
          # A full run starts every timing job at once (next-gpu-lane and both research smokes): waiting zero seconds
          # made whichever started second exit 75 (full runs 40433665126, 40443468068). Each takes minutes, so wait.
          wait: '1800'
          timeout: '3600'
          command: >-
            node autoresearch/drivers/built-ui-paired.mjs --label "$LABEL" --mode "${{ inputs.mode || 'smoke' }}"
            --route cpu --control .cache/control/tree/deploy-next --control-digest "$(node -p
            'require("./autoresearch/drivers/control.json").treeSha256')" --runtime "$RUNTIME" --out-root "$OUT"${{ steps.candidate.outputs.artifact_dir && format(' --candidate {0} --candidate-digest {1} --candidate-source run:{2}', steps.candidate.outputs.artifact_dir, steps.candidate.outputs.artifact_digest, inputs.candidate_run_id) || '' }}
      - name: Durable location
        if: always()
        run: |
          echo "Outputs on eris at $OUT/$LABEL (the record; this run's upload is a copy)" | tee -a "$GITHUB_STEP_SUMMARY"
          node -e 'const r = require(process.argv[1]); console.log(JSON.stringify({ passed: r.passed, timing: r.timing.run, control: r.artifacts.control.treeSha256, candidate: r.artifacts.candidate.treeSha256, errors: r.errors, samples: r.samples.map((s) => ({ side: s.side, passed: s.passed, frames: s.frames, steps: s.steps.map((x) => [x.name, Math.round(x.ms)]) })) }))' "$OUT/$LABEL/report.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-built-ui-media-${{ github.run_id }}
          path: ${{ env.OUT }}/${{ env.LABEL }}/
          retention-days: 14
          if-no-files-found: warn
