name: device-lab-tests
# The device lab's own unit tests (tools/device-lab): qualify's commit range read through the real GitHub API
# against this repository's main commits (fm-xwpw), the hosted-lane summary and artifact server, and the cold
# download's accounting. No device is touched; the device matrix stays on demand in device-lab.yml.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: [self-hosted, eris]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the range test compares the API's commits with local git
      - name: Unit tests
        working-directory: tools/device-lab
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m unittest -v test_lab_range test_hosted test_download test_lab_lock test_journeys
