name: device-lab-tests
# The device lab's own unit tests (tools/device-lab): qualify's commit range read through the real GitHub API
# against this repository's main commits (fm-xwpw), the hosted-lane summary and artifact server, and the cold
# download's accounting. No device is touched; the device matrix stays on demand in device-lab.yml.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    # Native Chromium's version-only identity assertion needs a supported CPU browser, not a device.
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the range test compares the API's commits with local git
      # test_journeys invokes the actual Node artifact stage/verifier.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pinned native Chromium for the browser identity assertion
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: |
          # Newer Playwright bundles identify as Chrome for Testing. This version-only assertion needs
          # actual Chromium, not Chrome; no page or device is opened with this pinned fixture.
          npx --yes playwright@1.56.0 install --no-shell chromium
          browser_cache="${PLAYWRIGHT_BROWSERS_PATH:-${XDG_CACHE_HOME:-$HOME/.cache}/ms-playwright}"
          binary="$browser_cache/chromium-1194/chrome-linux/chrome"
          "$binary" --version
          mkdir -p "$RUNNER_TEMP/device-lab-bin"
          ln -s "$binary" "$RUNNER_TEMP/device-lab-bin/chromium"
          echo "$RUNNER_TEMP/device-lab-bin" >> "$GITHUB_PATH"
      - name: Unit tests
        working-directory: tools/device-lab
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m unittest -v test_lab_range test_hosted test_download test_lab_lock test_journeys test_local_ports
