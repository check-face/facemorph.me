name: import-checks
# fm-5ey: build:next (deploy-next/ from the pinned control) and classic's next-site.yml `artifact` checks run in
# the destination against apps/web: every check shows a non-zero count; the Fable checks report "not applicable
# until the port".
on:
  workflow_call:
    inputs:
      shared_build:
        type: boolean
        default: false
        description: Reuse the exact compiled workspace from this main run
  workflow_dispatch:
jobs:
  checks:
    # Browser-free commands qualified on Triton; leave portable slots for browser/workerd lanes (fm-jx26).
    runs-on: [self-hosted, triton]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/restore-workspace-build
        if: inputs.shared_build
      - run: node --test scripts/import/build-next.test.mjs scripts/import/destination-checks.test.mjs
      - run: python3 scripts/import/control_site_test.py
      - uses: ./.github/actions/restore-site
        if: inputs.shared_build
      - if: inputs.shared_build
        run: npm run build:next -- --check
      - name: build:next (monorepo destination)
        if: ${{ !inputs.shared_build }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:next && npm run build:next -- --check
      - name: Destination checks
        run: node scripts/import/destination-checks.mjs
