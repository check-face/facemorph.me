name: import-checks
# fm-5ey: build:next (deploy-next/ from the pinned control) and classic's next-site.yml `artifact` checks run in
# the destination against apps/web: every check shows a non-zero count; the Fable checks report "not applicable
# until the port".
on:
  push:
    branches: [main]
    paths:
      [
        'package.json',
        'apps/web/**',
        'import/**',
        'scripts/import/**',
        'scripts/inventory/**',
        '.github/workflows/import-checks.yml',
      ]
  workflow_dispatch:
concurrency:
  group: import-checks
  cancel-in-progress: false
jobs:
  checks:
    runs-on: [self-hosted, triton]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/import/build-next.test.mjs scripts/import/destination-checks.test.mjs
      - name: build:next (control)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:next && npm run build:next -- --check
      - name: Destination checks
        run: node scripts/import/destination-checks.mjs
