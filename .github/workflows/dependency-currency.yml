name: Dependency currency controller
# Trusted base-branch orchestration only. Never check out or execute PR source with this token.
# Explicit dispatch preserves main.yml's one-running-pipeline queue and exact branch artifact provenance.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [main]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: dependency-controller-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || 'scan' }}
  cancel-in-progress: false
jobs:
  controller:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dispatch exact dependency head or evaluate its completed qualification
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER_MODE: ${{ github.event_name == 'workflow_run' && 'merge' || 'dispatch' }}
        run: node scripts/ci/dependency-controller.ts "$CONTROLLER_MODE"
