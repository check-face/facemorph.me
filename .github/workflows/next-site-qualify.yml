name: Qualify exact new-site artifact
# No build or workflow concurrency here: the caller supplies the completed artifact and owns queueing.
on:
  workflow_call:
    inputs:
      artifact_run:
        type: string
        required: true
      artifact_workflow:
        type: string
        required: true
      artifact_commit:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      runtime_sha:
        type: string
        default: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
permissions:
  contents: read
  actions: read
jobs:
  # Pushes and dispatches qualify the exact artifact through the real product journey; PR merge artifacts do not.
  qualify:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/next-e2e.yml
    permissions:
      contents: read
      actions: read
    with:
      artifact_run: ${{ inputs.artifact_run }}
      artifact_workflow: ${{ inputs.artifact_workflow }}
      artifact_commit: ${{ inputs.artifact_commit }}
      artifact_name: ${{ inputs.artifact_name }}
      runtime_sha: ${{ inputs.runtime_sha }}

  compiled-ui:
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch the exact artifact by explicit provenance
        id: artifact
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ github.repository_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: site
      - name: Verify exact built bytes
        working-directory: site
        run: |
          test "$(cat next-site-source.txt)" = '${{ inputs.artifact_commit }}'
          test -s deploy-next/index.html
          sha256sum --check next-site-SHA256SUMS
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - uses: ./.github/actions/setup-browser-harness
      - uses: ./.github/actions/setup-runtime
      - name: Native browser for the compiled artifact checks
        run: |
          binary=$(node -p 'require("playwright").chromium.executablePath()')
          echo "CHROMIUM_PATH=$binary" >> "$GITHUB_ENV"
      - name: Model-free checker real WASM, WebGPU loss, background and wall-clock budgets
        env:
          FACEMORPH_PREFLIGHT_SITE: site/deploy-next
        run: node --test apps/web/test/e2e/preflight.e2e.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-${{ github.sha }}
          path: apps/web/test-results/preflight/
          if-no-files-found: warn
      - name: Publication and qualification scripts parse
        run: python3 -m compileall -q apps/web/scripts hosting/next hosting/next-static apps/web/src/Next/browser
      - name: WebGPU bundle contract gate
        run: python3 -m unittest discover -s hosting/next-static -p 'webgpu_contract_test.py' -t hosting/next-static
      - name: Run actual artifact in Chromium, network checked by host class
        run: python3 scripts/ci/site/compiled_ui.py --artifact site/deploy-next --out next-artifact-ui-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-artifact-ui-evidence
          path: next-artifact-ui-evidence/
          if-no-files-found: warn
          retention-days: 14
