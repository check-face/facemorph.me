name: native-retirement
# Native retirement (fm-be10): no desktop/ import or native branch in the bridge and media, the build id without
# desktop/runtime.mjs, the re-homed web-artifact verifier (every classic check on planted artifacts, then the
# control-labelled deploy-next/ that build:next lays out), and no reference to the verifier's old path outside
# history notes, and the destination artifact scan for WebGL execution/native recommendations (fm-fy2.19).
# The same test files also run in root `npm test`, where the control case reports untested.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - name: build:next (monorepo destination)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:next && npm run build:next -- --check
      - name: Native retirement checks, with the actual destination artifact
        working-directory: apps/web
        env:
          FACEMORPH_REQUIRE_ARTIFACT: '1'
        run: node --test test/build/native-retirement.test.ts test/build/execution-scan.test.ts
