name: import-closure
# fm-gpx: the candidate's JS closure in apps/web is exactly the allowlist's frozen-commit bytes (nothing
# missing, changed or extra; nothing excluded; only the bridge's Fable import unresolved), and the pinned
# control artifact still downloads from its release asset and verifies file by file, with no weights,
# credentials or private provenance in it, and its emitted worker chunks match their pins.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  checks:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/import/control.test.mjs scripts/import/closure.test.mjs scripts/runtime/runtime.test.mjs
      # Files the app adds beside the imported closure (fm-svg shell and build, fm-s9n contracts, fm-l6mq media core, fm-4umi admission); everything else under apps/web
      # must be the allowlist's bytes.
      - run: >-
          node scripts/import/verify-closure.mjs --allow package.json --allow package-lock.json
          --allow browser-matrix.json --allow 'tsconfig*.json' --allow vite.config.ts --allow index.html --allow worker-check.html --allow render-check.html --allow .gitignore
          --allow 'build/**' --allow 'shell/**' --allow 'test/**' --allow 'src/photo/**' --allow 'src/contracts/**' --allow 'src/media/**' --allow 'src/admission/**' --allow 'src/project/**' --allow src/Next/browser/bridge-grant.mjs --allow src/Next/browser/admission.mjs --allow scripts/next-matrix-stages.mjs --allow scripts/next-matrix-stages.d.mts
      - run: node scripts/import/scan-exclusions.mjs
      - run: node scripts/inventory/unresolved-imports.mjs --root apps/web --lock package-lock.json --expect-none # one root lock (fm-fy2.4); none since the ProjectJson swap (fm-stth)
      - name: Control artifact downloads, verifies and scans clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dir=$(node scripts/import/fetch-control.mjs | tail -1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).summary;if(!r.ok)process.exit(1);console.log(r.dir)})')
          node scripts/import/scan-exclusions.mjs --dir "$dir/deploy-next" --provenance
          node scripts/runtime/check-pins.mjs --emitted "$dir/deploy-next"
