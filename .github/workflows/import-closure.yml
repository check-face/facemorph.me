name: import-closure
# Import behavior checks: exclusion safety, module resolution and retained control verification.
on:
  workflow_call:
    inputs:
      shared_build:
        type: boolean
        default: false
        description: Reuse the exact compiled workspace from this main run
  workflow_dispatch:
jobs:
  checks:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/restore-workspace-build
        if: inputs.shared_build
      - name: Build the package files mounted by the mobile browser suite
        if: ${{ !inputs.shared_build }}
        run: npm run build -w packages/stylegan-js -w packages/browser-model-manager
      - run: node --test scripts/import/control.test.mjs scripts/import/closure.test.mjs scripts/runtime/runtime.test.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/import/scan-exclusions.mjs
      - run: node scripts/inventory/unresolved-imports.mjs --root apps/web --lock package-lock.json --expect-none # one root lock (fm-fy2.4); none since the ProjectJson swap (fm-stth)
      - name: Control artifact downloads, verifies and scans clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dir=$(node scripts/import/fetch-control.mjs | tail -1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).summary;if(!r.ok)process.exit(1);console.log(r.dir)})')
          node scripts/import/scan-exclusions.mjs --dir "$dir/deploy-next" --provenance
          node scripts/runtime/check-pins.mjs --emitted "$dir/deploy-next"
