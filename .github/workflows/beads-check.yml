name: beads-check
# Closure rules br cannot enforce alone (scripts/beads/check-close-after.mjs): close-after order,
# no unchecked acceptance on a closed bead, no closed bead with an open blocker. A red run names the
# bead; reopen it or close the missing prerequisite first.
on:
  push:
    branches: [main]
    paths: ['.beads/**', 'scripts/beads/**', '.github/workflows/beads-check.yml']
  workflow_dispatch:
concurrency:
  group: beads-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: [self-hosted, triton]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/beads/*.test.mjs
      - run: node scripts/beads/check-close-after.mjs
