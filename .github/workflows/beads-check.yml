name: beads-check
# Closure rules br cannot enforce alone (scripts/beads/check-closure.mjs): no unchecked acceptance
# on a closed bead, no closed bead with an open blocker. A red run names the bead; reopen it or
# close the open blocker first.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/beads/*.test.mjs
      - run: node scripts/beads/check-closure.mjs
