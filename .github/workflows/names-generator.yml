name: names-generator
# Catalogue result generator (bead fm-a40f, tools/names-generator): pure-logic tests, then the real
# kill-and-resume test and the sampled typed-vs-catalogue check with the pinned candidate runtime in Chromium. eris: Playwright does not support
# triton's Ubuntu 20.04, and the runner reads the pinned classic commit from the local classic checkout.
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
        description: Include real catalogue inference and kill/resume in mandatory pre-deploy qualification
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' || inputs.full) && fromJSON('["self-hosted","eris"]') || fromJSON('["self-hosted","linux-x64"]') }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: tools/names-generator
    env:
      FACEMORPH_CLASSIC: /home/cdilga/Work/dev/checkface/facemorph.me-classic
      CHROMIUM: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
        with:
          directory: tools/names-generator
      - name: Pure catalogue identity, recovery, resume and numerical verdict checks
        if: ${{ github.event_name != 'workflow_dispatch' && !inputs.full }}
        run: node --test lib.test.mjs
      - name: Tests, the real runs with a bounded runner (a full catalogue run may hold it in chunks)
        if: github.event_name == 'workflow_dispatch' || inputs.full
        run: python3 ../../autoresearch/run.py --timeout 1800 -- npm test
