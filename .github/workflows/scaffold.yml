name: scaffold
# Independent checkouts let the read-only gates, seeded violations and npm-test shards run in parallel.
# The shard inventory is derived from the live npm scripts, including browser isolation and Python suites.
on:
  workflow_call:
    inputs:
      changed_files:
        type: string
        default: 'null'
        description: Exact stacked changed files as JSON; null means run every suite
      full:
        type: boolean
        required: false
        default: true
        description: Include full31 browser numerics (mandatory for full pre-deploy qualification)
      shared_build:
        type: boolean
        required: false
        default: false
        description: Restore this run's exact workspace-build artifact instead of rebuilding
      base:
        type: string
        required: false
        description: The previous started main.yml head (scripts/ci/changes.ts); empty without one
  workflow_dispatch:
jobs:
  checks:
    name: ${{ matrix.gate }}
    # All six pure Node/Oxc/build/pack groups are qualified on Triton; browser npm shards stay portable.
    runs-on: [self-hosted, triton]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gate: [format, lint, typecheck, seeded, format-stable, packages]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # interop compares against the previous started main.yml head
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - if: inputs.shared_build && (matrix.gate == 'packages' || matrix.gate == 'seeded')
        uses: ./.github/actions/restore-workspace-build
      - if: matrix.gate == 'format'
        run: npm run format:check
      - if: matrix.gate == 'lint'
        run: npm run lint
      - if: matrix.gate == 'typecheck'
        run: npm run typecheck
      # Seeded workspace typechecks resolve the same built declarations as the original serial gate.
      - if: matrix.gate == 'seeded' && !inputs.shared_build
        run: npm run build
      - if: matrix.gate == 'seeded'
        run: node scripts/build/seeded-gates.mjs
      - if: matrix.gate == 'format-stable'
        run: node scripts/build/format-stable.mjs
      - if: matrix.gate == 'packages'
        run: node scripts/build/check-scaffold.mjs
      - name: Every TypeScript-API tool resolves the one root TypeScript (the caret range at latest)
        if: matrix.gate == 'packages'
        run: |
          versions=$(npm ls typescript --all --parseable | xargs -I{} node -p "require('{}/package.json').version" | sort -u)
          echo "typescript: $versions"
          test "$versions" = "$(node -p "require('typescript/package.json').version")"
      - if: matrix.gate == 'packages'
        run: node scripts/build/interop-check.mjs --base "${BASE:-HEAD~1}"
        env:
          BASE: ${{ inputs.base }}
      - if: matrix.gate == 'packages' && !inputs.shared_build
        run: npm run build
      - if: matrix.gate == 'packages'
        run: node scripts/build/check-tests-listed.mjs
      - name: Every package packs
        if: matrix.gate == 'packages'
        run: for w in packages/stylegan-js packages/browser-model-manager packages/cloudflare-model-host packages/model-conv; do npm pack -w "$w" --dry-run >/dev/null || exit 1; done
      - name: The gates wrote nothing
        run: git diff --exit-code
  tests:
    name: npm test (${{ matrix.shard }}/6)
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # Controller tests independently re-verify the release in child processes.
      GITHUB_TOKEN: ${{ github.token }}
      FACEMORPH_ISOLATE_TEST_NETWORK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace
      - if: inputs.shared_build
        uses: ./.github/actions/restore-workspace-build
      - if: '!inputs.shared_build'
        run: npm run build
      # Full qualification must execute the model journeys, never rely on ambient runner caches.
      - uses: ./.github/actions/setup-playwright
        if: github.event_name == 'workflow_dispatch' || inputs.full
        with:
          browsers: chromium firefox webkit
      - uses: ./.github/actions/setup-runtime
        if: github.event_name == 'workflow_dispatch' || inputs.full
      - name: Bind model tests to the verified runtime and require all encoder canaries
        if: github.event_name == 'workflow_dispatch' || inputs.full
        run: |
          test -n "$FACEMORPH_RUNTIME_DIR"
          runtime_sha=$(sha256sum "$FACEMORPH_RUNTIME_DIR/manifest.json" | cut -c1-64)
          echo "FACEMORPH_RUNTIME_CACHE=$FACEMORPH_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "FACEMORPH_RUNTIME_SHA256=$runtime_sha" >> "$GITHUB_ENV"
          echo 'FACEMORPH_FULL_QUALIFY=1' >> "$GITHUB_ENV"
      - name: Run every npm-test file assigned to this shard
        run: |
          args=(--shard "$SHARD")
          if [ "$FULL" != true ]; then args+=(--quick); fi
          node scripts/ci/scaffold-test-shards.mjs "${args[@]}"
        env:
          SHARD: ${{ matrix.shard }}
          FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.full }}
          FACEMORPH_CHANGED_FILES: ${{ inputs.changed_files }}
      - name: The tests wrote nothing
        run: git diff --exit-code
  # Keep the dependency controller's existing required check context, scaffold / gates.
  gates:
    needs: [checks, tests]
    if: always()
    # Pure status aggregation must not queue behind browser/model jobs after all shards finish.
    runs-on: [self-hosted, triton]
    timeout-minutes: 2
    steps:
      - name: Every scaffold check and npm-test shard passed
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
        run: test "$CHECKS" = success && test "$TESTS" = success
