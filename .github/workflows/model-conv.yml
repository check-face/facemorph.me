name: model-conv
# packages/model-conv (fm-uh14): unit tests, then the real acceptance run (build, convert and verify the FFHQ
# checkpoint against the upstream reference, perturbed chunk, killed run, ownership, image scan) on eris.
# The checkpoint is cached in the runner's home after its first download.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: [self-hosted, eris]
    timeout-minutes: 180
    defaults:
      run:
        working-directory: packages/model-conv
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: build() output validates against the producer-facing model manifest schema
        run: |
          set -euo pipefail
          python3 -c "import json,sys; sys.path.insert(0,'.'); from tests.test_manifest import built; from model_conv.models import FFHQ_CONFIG_F; json.dump(built(chunk_bytes=FFHQ_CONFIG_F.chunk_bytes), sys.stdout)" > "$RUNNER_TEMP/build-manifest.json"
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s ../browser-model-manager/schema/model-manifest.v1.schema.json -d "$RUNNER_TEMP/build-manifest.json" --errors=text
      - name: Documented commands, verbatim (docs/usage.md; FFHQ and the AFHQ cat non-face model), under the eris lease
        uses: ./.github/actions/run-command
        with:
          timeout: '3000'
          command: python3 packages/model-conv/tests/doc_commands.py
      - name: Converted manifests validate against the producer-facing model manifest schema
        run: |
          set -euo pipefail
          # Generator outputs; the e4e encoder output has its own manifest form.
          for m in out/ffhq/manifest.json out/afhqcat/manifest.json; do
            npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s ../browser-model-manager/schema/model-manifest.v1.schema.json -d "$m" --errors=text
          done
      - name: Hand-off set (manifests, verify reports; no weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-conv-handoff-${{ github.run_id }}
          path: |
            packages/model-conv/out/*/manifest.json
            packages/model-conv/out/*/verify.json
            packages/model-conv/out/*/canaries.json
          if-no-files-found: warn
          retention-days: 90
      - name: Acceptance (real checkpoint, real container), under the eris lease
        uses: ./.github/actions/run-command
        with:
          timeout: '3000'
          command: cd packages/model-conv && tests/acceptance.sh
