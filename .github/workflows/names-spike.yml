name: names-spike
# Names data-shape measurement (fm-zg31, tools/names-spike): tests, then the full measurement against the pinned
# candidate catalogue and its published previews (cached in the runner's home after the first run). The
# results and summary are the run's artifact; the chosen shape and bars are in docs/names/data-shape.md.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  measure:
    # The temporary Ubuntu 24.04 pool supports Chromium; Triton's Ubuntu 20.04 does not.
    runs-on: [self-hosted, tempcpu]
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/names-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
        with:
          directory: tools/names-spike
      - run: npm test
      - run: npx playwright install chromium
      - name: Measure (with a bounded runner)
        uses: ./.github/actions/run-command
        with:
          timeout: '2400'
          command: cd tools/names-spike && node measure.mjs --out out/ci
      - name: Summary
        if: always()
        run: test -f out/ci/summary.md && cat out/ci/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: names-spike-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/names-spike/out/ci/
          retention-days: 30
          if-no-files-found: warn
