name: build-identity
# Build identity and test-retention checks (fm-pud): per-root identity and the checks a push selects, the worker
# graphs of the built app against its pins and the qualified runtime, artifact identity for the control, no
# test removed or renamed without a tests/retired.txt entry, no disabled test without reason/owner/removal
# condition, and no encoded-image hash assertion without its replacement.
on:
  workflow_call:
    inputs:
      shared_build:
        type: boolean
        default: false
        description: Reuse the exact compiled workspace from this main run
      base:
        type: string
        required: false
        description: The previous started main.yml head (scripts/ci/changes.ts); empty without one
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, linux-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --base needs the previous push's commit
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - uses: ./.github/actions/restore-workspace-build
        if: inputs.shared_build
      - uses: ./.github/actions/setup-runtime
      - name: Unit tests of the checks
        run: >-
          node --test scripts/build/identity.test.mjs scripts/build/check-tests-listed.test.mjs
          scripts/build/check-no-disabled-tests.test.mjs scripts/build/check-image-hash-asserts.test.mjs
      - name: No test removed or renamed without a tests/retired.txt entry
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ inputs.base }}
        run: |
          base="${BASE:-$BEFORE}" # a stacked main.yml run covers every commit since the previous started run
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          node scripts/build/check-tests-listed.mjs --base "$base"
      - run: node scripts/build/check-no-disabled-tests.mjs
      - run: node scripts/build/check-image-hash-asserts.mjs
      - name: Root identities and the checks this push selects
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ inputs.base }}
        run: |
          node scripts/build/identity.mjs > identity.json
          base="${BASE:-$BEFORE}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=HEAD~1; fi
          git diff --name-only "$base" HEAD | xargs node scripts/build/identity.mjs --changed
      - name: Every path an identity maps is selected by the shared path filters
        run: node scripts/build/identity.mjs --coverage
      - if: ${{ !inputs.shared_build }}
        run: npm run build
      - name: Worker graphs against their pins and the qualified runtime
        run: node scripts/build/identity.mjs --workers apps/web/dist --hosted "$FACEMORPH_RUNTIME_DIR"
      - uses: ./.github/actions/restore-site
        if: inputs.shared_build
      - if: inputs.shared_build
        run: npm run build:next -- --check
      - name: Artifact identity of the control
        if: ${{ !inputs.shared_build }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:next && node scripts/build/identity.mjs --artifact . | tee artifact-identity.json
      - if: inputs.shared_build
        run: node scripts/build/identity.mjs --artifact . | tee artifact-identity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-identity-${{ github.run_id }}
          path: |
            identity.json
            artifact-identity.json
