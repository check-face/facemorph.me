name: release-gate
# fm-5klw: everything a deploy of one exact artifact needs. The hosted lanes (hosted-lanes.yml:
# macOS, Windows, Android emulator, iOS Simulator) and the eris device-lab cells (device-lab.yml:
# eris-webgpu, eris-cpu) run the same journeys against that artifact; the
# `gate` job requires completed local cells and the bounded hosted supervisor:
# available lanes pass, unallocated runners are explicitly untested, real failures block.
# The physical phone never
# runs in CI (operator, 25 October 2026): it verifies candidates locally during development and the
# deployed release at handover (fm-s3o). The device lab shares the runner with everything else —
# correctness journeys take no lock; the release manager records an unavailable cell as
# untested (PLAN.md, device lab, deploy gates and CI policy).
on:
  workflow_dispatch:
    inputs:
      artifact_source_repo_id:
        required: true
        description: Numeric source repository ID
      artifact_workflow:
        required: true
        description: Source workflow file
      artifact_commit:
        required: true
        description: Full source commit SHA
      artifact_run:
        description: Build run id in facemorph.me-classic
        required: true
      artifact_name:
        description: Its site artifact
        required: true
      runtime_sha:
        description: Runtime manifest SHA256 the artifact was qualified with
        default: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
  workflow_call:
    inputs:
      artifact_source_repo_id:
        type: string
        required: true
        description: Numeric source repository ID
      artifact_workflow:
        type: string
        required: true
        description: Source workflow file
      artifact_commit:
        type: string
        required: true
        description: Full source commit SHA
      artifact_run:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      runtime_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  hosted:
    permissions:
      contents: read
      actions: write # dispatch the separately bounded hosted attempt, never cancel it
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/fetch-artifact
        id: artifact
        with:
          source_repo_id: ${{ inputs.artifact_source_repo_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: artifact
      - name: Bounded hosted attempt, with explicit unavailable outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS: ${{ toJSON(inputs) }}
          DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
        shell: bash
        run: |
          printf '%s' "$INPUTS" > hosted-inputs.json
          python3 tools/device-lab/hosted.py release --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" --inputs hosted-inputs.json --artifact-digest "$DIGEST" --out hosted-evidence | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-release-${{ github.run_id }}
          path: hosted-evidence/
          if-no-files-found: warn
  device-lab:
    uses: ./.github/workflows/device-lab.yml
    with:
      artifact_source_repo_id: ${{ inputs.artifact_source_repo_id }}
      artifact_workflow: ${{ inputs.artifact_workflow }}
      artifact_commit: ${{ inputs.artifact_commit }}
      artifact_run: ${{ inputs.artifact_run }}
      artifact_name: ${{ inputs.artifact_name }}
      runtime_sha: ${{ inputs.runtime_sha }}
      cells: eris-webgpu,eris-cpu
      journey: cold-face,warm-face,morph
      label: gate-${{ inputs.artifact_name }}
  gate:
    needs: [hosted, device-lab]
    if: always()
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 10
    steps:
      - name: Available hosted lanes and required local cells qualify
        env:
          HOSTED: ${{ needs.hosted.result }}
          LAB: ${{ needs.device-lab.result }}
        run: |
          echo "hosted lanes: $HOSTED; device-lab cells: $LAB" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$HOSTED" = success && test "$LAB" = success
