name: stats-worker
on:
  workflow_call:
  workflow_dispatch:
concurrency:
  group: stats-worker-deploy
  cancel-in-progress: false
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
        with:
          directory: services/stats
      - run: npm test
      - name: Deploy and set scrape token with cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STATS_SCRAPE_TOKEN: ${{ secrets.STATS_SCRAPE_TOKEN }}
          CF_SEND_TELEMETRY: 'false'
        run: |
          set -euo pipefail
          ./node_modules/.bin/cf auth whoami
          umask 077
          stats_secrets=$(mktemp "$RUNNER_TEMP/facemorph-stats-secrets.XXXXXX")
          trap 'rm -f "$stats_secrets"' EXIT
          STATS_SECRETS_FILE="$stats_secrets" node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const value = process.env.STATS_SCRAPE_TOKEN;
          if (!value) throw Error('STATS_SCRAPE_TOKEN is required');
          writeFileSync(process.env.STATS_SECRETS_FILE, JSON.stringify({ SCRAPE_TOKEN: value }), { mode: 0o600 });
          JS
          npm run deploy -- --secrets-file "$stats_secrets"
      - name: Smoke check
        env:
          STATS_SCRAPE_TOKEN: ${{ secrets.STATS_SCRAPE_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://next.facemorph.me/stats/metrics)
          test "$code" = 401
          # A newly set secret takes a few seconds to reach the edge.
          for i in 1 2 3 4 5 6; do
            curl -sf -H "Authorization: Bearer $STATS_SCRAPE_TOKEN" https://next.facemorph.me/stats/metrics > /dev/null && exit 0
            sleep 10
          done
          exit 1
