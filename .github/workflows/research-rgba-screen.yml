name: research-rgba-screen
# fm-qqh: re-homed from classic's research-rgba-screen-v1.yml (the RGBA media codec screen). Classic's screen is a
# component page importing classic source paths (src/Next/..., src/public/...) and consumes no artifact; it stays
# frozen history in autoresearch/candidates/direct-rgba-media-v1/. This workflow measures the same media path at the
# product boundary of an exact artifact with the maintained morph-frame product driver
# (autoresearch/drivers/morph-frame-product.mjs): synthesized frames, frames handed to the video writer, playable
# video and Save video, on eris's RTX 2080 SUPER through WebGPU (a software adapter is refused). Experimental: bounded,
# separate from product checks, never a required status. Outputs land in eris's durable research directory; the
# uploaded artifact is only a copy.
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: false
        description: 'smoke (one sample per side) or paired (warmup + ABBA x3; refuses load above 4)'
  workflow_dispatch:
    inputs:
      mode:
        description: smoke (one sample per side) or paired (warmup + ABBA x3; refuses load above 4)
        type: choice
        options: [smoke, paired]
        default: smoke
permissions:
  contents: read
jobs:
  smoke:
    runs-on: [self-hosted, eris]
    timeout-minutes: 75
    env:
      LABEL: ci-morph-frame-${{ github.run_id }}-${{ github.run_attempt }}
      OUT: /home/cdilga/Work/runs/facemorph-research
      RUNTIME: /home/cdilga/.cache/facemorph-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-workspace # node_modules for the lockfile, shared on the runner (fm-98po)
      - name: Driver tests
        run: node --test autoresearch/drivers/drivers.test.mjs
      - name: build:next (the pinned control, digest re-verified)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:next && npm run build:next -- --check
      - name: Worker readiness, with a hardware WebGPU adapter (leased; the probe uses the GPU)
        uses: ./.github/actions/device-lease
        with:
          device: eris
          lane: browser-gpu
          timeout: '300'
          wait: '1800'
          command: >-
            node autoresearch/workers/check.mjs --lane browser-gpu --smoke --runtime "$RUNTIME"
      - name: Leased morph-frame run against the control artifact
        uses: ./.github/actions/device-lease
        with:
          device: eris
          lane: browser-gpu
          timeout: '3600'
          wait: '1800'
          command: >-
            node autoresearch/drivers/morph-frame-product.mjs --label "$LABEL" --mode "${{ inputs.mode || 'smoke' }}"
            --route webgpu --control deploy-next --control-digest "$(node -p
            'require("./autoresearch/drivers/control.json").treeSha256')" --runtime "$RUNTIME" --out-root "$OUT"
      - name: Durable location
        if: always()
        run: |
          echo "Outputs on eris at $OUT/$LABEL (the record; this run's upload is a copy)" | tee -a "$GITHUB_STEP_SUMMARY"
          node -e 'const r = require(process.argv[1]); console.log(JSON.stringify({ passed: r.passed, lease: r.lease.run, control: r.artifacts.control.treeSha256, candidate: r.artifacts.candidate.treeSha256, errors: r.errors, samples: r.samples.map((s) => ({ side: s.side, passed: s.passed, frames: s.frames, steps: s.steps.map((x) => [x.name, Math.round(x.ms)]) })) }))' "$OUT/$LABEL/report.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-rgba-screen-${{ github.run_id }}
          path: ${{ env.OUT }}/${{ env.LABEL }}/
          retention-days: 14
          if-no-files-found: warn
