name: command-runner
# Bounded process cleanup, GPU timing exclusion and per-device lab locks with real processes.
on:
  workflow_call:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, linux-x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 autoresearch/test_run.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
