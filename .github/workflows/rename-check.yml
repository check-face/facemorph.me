name: rename-check
# Organization rename check (fm-rur): check-rename.mjs's tests against the real GitHub API (read-only), then the
# check itself. On push it runs the pre-rename assertions under facemorph-me. Dispatch it with org=facemorph-me
# immediately after the rename to run the post-rename assertions.
on:
  workflow_call:
    inputs:
      org:
        type: string
        required: false
        description: 'Organization the repositories should be under now'
  workflow_dispatch:
    inputs:
      org:
        description: Organization the repositories should be under now
        default: facemorph-me
        type: string
jobs:
  check:
    runs-on: [self-hosted, eris]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check-script tests against the real API
        run: node --test scripts/identity/check-rename.test.mjs
      - name: Rename assertions
        env:
          ORG: ${{ inputs.org || 'facemorph-me' }}
        run: node scripts/identity/check-rename.mjs --org "$ORG"
