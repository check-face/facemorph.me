name: New site browser matrix
# fm-7ge, carried over from classic's next-matrix.yml: the product workflow on each engine against a deployed or
# staged origin, one row per engine and operating system. A row is evidence for that engine on that system only:
# WebKit on Linux is not Safari on macOS or iOS, macOS WebKit is Playwright WebKit and not Safari, and Chromium here
# is not Chrome on a phone. Physical-device rows are attached separately; a missing one stays missing.
# Manual mode exercises its deployed origin; workflow_call qualifies one exact candidate artifact for fm-r4a.
on:
  workflow_call:
    inputs:
      artifact_source_repo_id:
        type: string
        required: true
      artifact_workflow:
        type: string
        required: true
      artifact_run:
        type: string
        required: true
      artifact_commit:
        type: string
        required: true
      artifact_name:
        type: string
        required: true
      runtime_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      origin:
        description: Deployed or staged origin to exercise
        required: true
        default: https://next.facemorph.me
      runtime_sha:
        description: Expected runtime manifest SHA256 of the deployed bundle (fails closed if changed)
        required: true
        default: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
permissions:
  contents: read
  actions: read
jobs:
  engines:
    name: ${{ matrix.os }} ${{ matrix.engine }} (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-24.04,
              engine: chromium,
              label: 'Playwright Chromium, not Chrome on a phone',
            }
          - { os: ubuntu-24.04, engine: firefox, label: 'Playwright Firefox on Linux' }
          - { os: ubuntu-24.04, engine: webkit, label: 'WebKit on Linux, not iOS' }
          - { os: macos-15, engine: webkit, label: 'Playwright WebKit, not Safari' }
          - { os: macos-15, engine: firefox, label: 'Playwright Firefox on macOS' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The driver uses apps/web's pinned playwright when scripts/matrix-tools is absent (next-matrix.mjs).
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
        working-directory: apps/web
      - name: Fetch the exact candidate by explicit provenance
        if: inputs.artifact_run != ''
        uses: ./.github/actions/fetch-artifact
        with:
          source_repo_id: ${{ inputs.artifact_source_repo_id }}
          workflow: ${{ inputs.artifact_workflow }}
          run_id: ${{ inputs.artifact_run }}
          commit: ${{ inputs.artifact_commit }}
          artifact_name: ${{ inputs.artifact_name }}
          out: matrix-artifact
      - if: inputs.artifact_run != ''
        uses: ./.github/actions/setup-runtime
      - name: Drive ${{ matrix.engine }} against the exact locally served candidate
        if: inputs.artifact_run != ''
        env:
          MATRIX_COMMIT: ${{ inputs.artifact_commit }}
          MATRIX_RUNTIME_SHA: ${{ inputs.runtime_sha }}
          MATRIX_ENGINE: ${{ matrix.engine }}
          MATRIX_OUT: next-matrix-${{ matrix.os }}-${{ matrix.engine }}.json
        run: >-
          node scripts/ci/site/matrix-artifact.mjs --artifact matrix-artifact --commit "$MATRIX_COMMIT"
          --runtime "$FACEMORPH_RUNTIME_DIR" --runtime-sha "$MATRIX_RUNTIME_SHA"
          --engine "$MATRIX_ENGINE" --out "$MATRIX_OUT"
      - name: Drive ${{ matrix.engine }} against the deployed candidate
        if: inputs.artifact_run == ''
        env:
          NEXT_MATRIX_ORIGIN: ${{ inputs.origin }}
          NEXT_MATRIX_RUNTIME_SHA: ${{ inputs.runtime_sha }}
          NEXT_MATRIX_OUT: next-matrix-${{ matrix.os }}-${{ matrix.engine }}.json
        run: node apps/web/scripts/next-matrix.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-matrix-${{ matrix.os }}-${{ matrix.engine }}
          path: |
            next-matrix-*.json
            next-matrix-*.failure.png
            next-matrix-*.trace.zip
          if-no-files-found: warn
          retention-days: 14
  summary:
    needs: engines
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: matrix
      # Exits 1 unless every required stage passed in every row; a missing, failed or incomplete row never passes.
      - name: Build the matrix table
        run: python3 apps/web/scripts/next-matrix-summary.py matrix >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-matrix-summary
          path: next-matrix-summary.md
          if-no-files-found: error
          retention-days: 14
