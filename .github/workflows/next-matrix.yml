name: POST-DEPLOY matrix on next.facemorph.me (fe0da5a live)
# Runs the product workflow on each engine and reports a row per engine. A row is evidence for
# that engine on that operating system only. WebKit on Linux is not Safari on macOS or iOS, and
# Chromium here is not Chrome on a phone; physical-device rows are attached separately and a
# missing one stays missing rather than borrowing another row's result.
on:
  # TEMPORARY: workflow_dispatch only resolves for workflows on the default branch, so this branch adds a
  # pull_request trigger to run the matrix against a non-live Worker version before it is deployed.
  pull_request:
    paths: ['.github/workflows/next-matrix.yml']
  workflow_dispatch:
    inputs:
      origin:
        description: Deployed origin to exercise
        required: true
        default: https://next.facemorph.me
      runtime_sha:
        description: Expected runtime manifest SHA256 of the deployed bundle (fails closed if changed)
        required: true
        default: d9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c
permissions:
  contents: read
jobs:
  engines:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            engine: chromium
          - os: ubuntu-24.04
            engine: firefox
          - os: ubuntu-24.04
            engine: webkit
          - os: macos-14
            engine: webkit
          - os: macos-14
            engine: firefox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the matrix runner only
        run: npm ci --prefix scripts/matrix-tools
      - run: npx --prefix scripts/matrix-tools playwright install --with-deps ${{ matrix.engine }}
      - name: Drive ${{ matrix.engine }} against the deployed candidate
        env:
          NEXT_MATRIX_ORIGIN: ${{ inputs.origin || 'https://next.facemorph.me' }}
          NEXT_MATRIX_RUNTIME_SHA: ${{ inputs.runtime_sha || 'd9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c' }}
          NEXT_MATRIX_EXPECT_BUNDLE: app.4c99dcbab2ee92803b8a.js
          NEXT_MATRIX_OUT: next-matrix-${{ matrix.os }}-${{ matrix.engine }}.json
        run: node scripts/next-matrix.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-matrix-${{ matrix.os }}-${{ matrix.engine }}
          path: next-matrix-*.json
          if-no-files-found: warn
          retention-days: 14
  control:
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            engine: chromium
          - os: ubuntu-24.04
            engine: firefox
          - os: ubuntu-24.04
            engine: webkit
          - os: macos-14
            engine: webkit
          - os: macos-14
            engine: firefox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the matrix runner only
        run: npm ci --prefix scripts/matrix-tools
      - run: npx --prefix scripts/matrix-tools playwright install --with-deps ${{ matrix.engine }}
      - name: CONTROL (same interception, current version) - drive ${{ matrix.engine }} against production
        env:
          NEXT_MATRIX_ORIGIN: ${{ inputs.origin || 'https://next.facemorph.me' }}
          NEXT_MATRIX_RUNTIME_SHA: ${{ inputs.runtime_sha || 'd9e37e50a436e9fb7c0c7f973e70adee353c808f48c6a51fa5a9186f1c650a5c' }}
          NEXT_MATRIX_VERSION_OVERRIDE: 'facemorph-next="9ae911eb-d612-42af-ae35-97ef80e172b3"'
          NEXT_MATRIX_EXPECT_BUNDLE: app.51beb6b389527a01e354.js
          NEXT_MATRIX_OUT: next-matrix-control-${{ matrix.os }}-${{ matrix.engine }}.json
        run: node scripts/next-matrix.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-matrix-control-${{ matrix.os }}-${{ matrix.engine }}
          path: next-matrix-*.json
          if-no-files-found: warn
          retention-days: 14
  repro:
    if: ${{ false }}
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix scripts/matrix-tools
      - run: npx --prefix scripts/matrix-tools playwright install --with-deps ${{ matrix.engine }}
      - name: Whole cold acquisition in a Worker
        run: |
          d=autoresearch/devices/eris
          PW_ROOT=scripts/matrix-tools node $d/engine-cache-repro.mjs ${{ matrix.engine }} $d/repro-variants/sha256.mjs \
            old=$d/repro-variants/old.mjs new_ra2=$d/repro-variants/new.mjs:2 new_ra1=$d/repro-variants/new.mjs:1
  summary:
    needs: [engines, control]
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: matrix
      - name: Build the matrix table
        run: python3 scripts/next-matrix-summary.py matrix >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: next-matrix-summary
          path: next-matrix-summary.md
          if-no-files-found: error
          retention-days: 14
