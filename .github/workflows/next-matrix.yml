name: New site browser matrix
# Runs the product workflow on each engine and reports a row per engine. A row is evidence for
# that engine on that operating system only. WebKit on Linux is not Safari on macOS or iOS, and
# Chromium here is not Chrome on a phone; physical-device rows are attached separately and a
# missing one stays missing rather than borrowing another row's result.
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Successful New site artifact workflow run ID
        required: true
      artifact_name:
        description: Exact next-site-<source SHA> artifact name from that run
        required: true
      runtime_sha:
        description: Public runtime manifest SHA256 (fails closed if changed)
        required: true
        default: 982f73bc24a4437385e34ef8ed52190b578024673d694f6b10ac09ae6b71624c
permissions:
  contents: read
  actions: read
jobs:
  engines:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            engine: chromium
          - os: ubuntu-24.04
            engine: firefox
          - os: ubuntu-24.04
            engine: webkit
          - os: macos-14
            engine: webkit
          - os: macos-14
            engine: firefox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Validate artifact run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run }}
          ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT" =~ ^next-site-[a-f0-9]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > source-run.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('source-run.json'))
          assert r['conclusion']=='success' and r['path']=='.github/workflows/next-site.yml'
          assert os.environ['ARTIFACT']=='next-site-'+r['head_sha']
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ github.token }}
      - name: Verify exact artifact
        run: |
          python3 - <<'PY'
          import json,pathlib
          assert pathlib.Path('next-site-source.txt').read_text().strip()==json.load(open('source-run.json'))['head_sha']
          PY
          python3 desktop/scripts/verify-web-artifact.py --artifact . --revision "$(cat next-site-source.txt)" --receipt next-web-verification.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the matrix runner only
        run: npm ci --prefix scripts/matrix-tools
      - run: npx --prefix scripts/matrix-tools playwright install --with-deps ${{ matrix.engine }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Serve the exact bytes and drive ${{ matrix.engine }}
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
          NEXT_MATRIX_ORIGIN: https://127.0.0.1:8443
          NEXT_MATRIX_OUT: next-matrix-${{ matrix.os }}-${{ matrix.engine }}.json
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          [[ "$RUNTIME_SHA" =~ ^[a-f0-9]{64}$ ]]
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/next.key" -out "$RUNNER_TEMP/next.crt" -days 1 -subj '/CN=next.facemorph.me' >/dev/null 2>&1
          python3 scripts/next-e2e-server.py --manifest-sha "$RUNTIME_SHA" --cert "$RUNNER_TEMP/next.crt" --key "$RUNNER_TEMP/next.key" > matrix-server.log 2>&1 &
          for attempt in $(seq 1 40); do curl -kfsS --max-time 2 https://127.0.0.1:8443/runtime/manifest.json >/dev/null 2>&1 && break; sleep 1; done
          curl -kfsS https://127.0.0.1:8443/runtime/manifest.json >/dev/null
          node scripts/next-matrix.mjs ${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-matrix-${{ matrix.os }}-${{ matrix.engine }}
          path: |
            next-matrix-*.json
            matrix-server.log
          if-no-files-found: warn
          retention-days: 14
  summary:
    needs: engines
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: matrix
      - name: Build the matrix table
        run: python3 scripts/next-matrix-summary.py matrix >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: next-matrix-summary
          path: next-matrix-summary.md
          if-no-files-found: error
          retention-days: 14
