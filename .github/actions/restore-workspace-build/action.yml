name: restore-workspace-build
description: >-
  Restore the compiled workspace outputs produced by build:next in this same workflow run. Requires Node 24,
  a clean checkout of github.sha and the ordinary setup-workspace dependencies. Refuses changed source, lockfile,
  artifact bytes or archive paths. Standalone workflows keep their local build unless explicitly wired here.
runs:
  using: composite
  steps:
    - id: location
      shell: bash
      run: echo "directory=$(mktemp -d "$RUNNER_TEMP/workspace-build-XXXXXX")" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v4
      with:
        name: workspace-build-${{ github.sha }}
        path: ${{ steps.location.outputs.directory }}
    - name: Verify and restore the four compiled directories
      shell: bash
      env:
        WORKSPACE_BUILD_FROM: ${{ steps.location.outputs.directory }}
      run: >-
        node "$GITHUB_ACTION_PATH/../../../scripts/ci/workspace-build.mjs" restore
        --root "$GITHUB_WORKSPACE" --from "$WORKSPACE_BUILD_FROM" --commit "$GITHUB_SHA"
    - if: always()
      shell: bash
      env:
        WORKSPACE_BUILD_FROM: ${{ steps.location.outputs.directory }}
      run: |
        if [ -n "$WORKSPACE_BUILD_FROM" ]; then rm -rf -- "$WORKSPACE_BUILD_FROM"; fi
