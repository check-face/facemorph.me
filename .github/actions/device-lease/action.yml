name: device-lease
description: >-
  Runs one heavy command under the machine's device lease (autoresearch/run.py through
  scripts/ci/lease/lease_run.py, fm-wzy): the same per-machine lease local agents, research and the device lab
  take, so a CI job never shares a GPU or the phone with them. The command's output streams into the job log;
  the run's journal folder (run.json, output.log) is uploaded. Busy exits 75 unless a bounded wait is given;
  a timeout ends the command's whole process group and fails. Exit zero is execution, not qualification.
inputs:
  device:
    description: The machine doing the work (or a device attached to it), e.g. eris
    required: true
  lane:
    description: build, browser-cpu, browser-gpu, native-cpu or native-gpu
    required: true
  command:
    description: The command, run with bash -c
    required: true
  timeout:
    description: Seconds, at most 3600
    required: false
    default: '600'
  wait:
    description: Seconds to wait for a busy device, at most 3600 (0 exits 75 at once)
    required: false
    default: '0'
  journal-name:
    description: Name of the uploaded journal artifact
    required: false
    default: ''
outputs:
  run_dir:
    description: The lease run folder (run.json, output.log)
    value: ${{ steps.lease.outputs.run_dir }}
  run_id:
    description: The lease run id, as in the machine journal
    value: ${{ steps.lease.outputs.run_id }}
  status:
    description: completed, failed, timeout or interrupted
    value: ${{ steps.lease.outputs.status }}
runs:
  using: composite
  steps:
    - id: lease
      shell: bash
      env:
        LEASE_DEVICE: ${{ inputs.device }}
        LEASE_LANE: ${{ inputs.lane }}
        LEASE_TIMEOUT: ${{ inputs.timeout }}
        LEASE_WAIT: ${{ inputs.wait }}
        LEASE_COMMAND: ${{ inputs.command }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../scripts/ci/lease/lease_run.py" --device "$LEASE_DEVICE" --lane
        "$LEASE_LANE" --timeout "$LEASE_TIMEOUT" --wait "$LEASE_WAIT" -- bash -c "$LEASE_COMMAND"
    - if: always() && steps.lease.outputs.run_dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.journal-name != '' && inputs.journal-name || format('lease-{0}', steps.lease.outputs.run_id) }}
        path: ${{ steps.lease.outputs.run_dir }}
        retention-days: 14
        if-no-files-found: warn
