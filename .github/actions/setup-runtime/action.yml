name: setup-runtime
description: Complete verified runtime; runner-local storage on self-hosted workers, Actions cache on hosted workers.
runs:
  using: composite
  steps:
    - name: Select the runtime cache
      id: runtime
      shell: bash
      env:
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
      run: |
        pins=$(node scripts/ci/runtime-cache-key.mjs)
        echo "pins=$pins" >> "$GITHUB_OUTPUT"
        runtime="$GITHUB_WORKSPACE/.cache/ci-runtime"
        if [ "$RUNNER_ENVIRONMENT" != github-hosted ]; then
          base="${RUNNER_TOOL_CACHE:?}/facemorph-runtime"
          runtime="$base/$pins"
          compat="$GITHUB_WORKSPACE/.cache/ci-runtime"
          # Only this action's pin-keyed links may be replaced. Preserve unexpected files, directories
          # and links rather than following them into another job's or session's runtime.
          if [ -L "$GITHUB_WORKSPACE/.cache" ] || [ -L "$base" ] || [ -L "$runtime" ]; then
            echo '::error::Runtime cache parent or persistent directory is an unexpected symlink' >&2
            exit 1
          fi
          if [ -L "$compat" ]; then
            previous=$(readlink "$compat")
            if [[ ! "$previous" =~ ^"$base"/[0-9a-f]{64}$ ]]; then
              echo '::error::Refusing to replace an unexpected .cache/ci-runtime symlink' >&2
              exit 1
            fi
          elif [ -e "$compat" ]; then
            echo '::error::Refusing to replace an existing .cache/ci-runtime path' >&2
            exit 1
          fi
          mkdir -p "$runtime" "$GITHUB_WORKSPACE/.cache"
          ln -sfnT "$runtime" "$compat"
        fi
        echo "dir=$runtime" >> "$GITHUB_OUTPUT"
    - if: runner.environment == 'github-hosted'
      uses: actions/cache@v4
      with:
        path: .cache/ci-runtime
        key: runtime-pins-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.pins }}
    - name: Acquire every pinned runtime file
      shell: bash
      env:
        ACCEPT_MODEL_TERMS: 'yes'
        RUNTIME_DIR: ${{ steps.runtime.outputs.dir }}
      run: node scripts/runtime/acquire-ci.mjs --cache "$RUNTIME_DIR"
    - name: Verify the runtime worker graph, including cache hits
      shell: bash
      env:
        RUNTIME_DIR: ${{ steps.runtime.outputs.dir }}
      run: |
        node scripts/runtime/check-pins.mjs --runtime "$RUNTIME_DIR" > "$RUNNER_TEMP/runtime-pins.jsonl"
        tail -1 "$RUNNER_TEMP/runtime-pins.jsonl"
        echo "FACEMORPH_CONTROL_RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"
        echo "FACEMORPH_RUNTIME_DIR=$RUNTIME_DIR" >> "$GITHUB_ENV"
    - name: Acquire and verify the reviewed candidate separately from the frozen control
      if: hashFiles('import/runtime-mirror.json') != ''
      shell: bash
      env:
        CONTROL_RUNTIME_DIR: ${{ steps.runtime.outputs.dir }}
        GH_TOKEN: ${{ github.token }}
      run: |
        candidate=$(mktemp -d "$RUNNER_TEMP/candidate-runtime-XXXXXX")
        node scripts/ci/acquire-candidate-runtime.ts --repo . \
          --control-runtime "$CONTROL_RUNTIME_DIR" --out "$candidate/runtime" \
          > "$RUNNER_TEMP/candidate-runtime.json"
        node --input-type=module - "$RUNNER_TEMP/candidate-runtime.json" <<'JS'
        import { appendFileSync, readFileSync } from 'node:fs';
        const result = JSON.parse(readFileSync(process.argv[2], 'utf8'));
        appendFileSync(process.env.GITHUB_ENV, `FACEMORPH_RUNTIME_DIR=${result.runtimeDir}\n`);
        JS
