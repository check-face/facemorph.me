<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FaceMorph desktop scaffold</title>
  <style>
    :root { color-scheme: dark light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { max-width: 34rem; padding: 3rem; }
    h1 { font-size: 2.3rem; letter-spacing: -.04em; }
    p { line-height: 1.65; opacity: .8; }
    code { user-select: all; font-size: 1rem; }
  </style>
</head>
<body>
  <div id="elmish-app"><main>
    <h1>FaceMorph desktop</h1>
    <p>This development scaffold starts the desktop shell. Face generation and native integrations will come later.</p>
    <p>Use the web preview in your browser:</p>
    <code>https://next.facemorph.me</code>
  </main></div>
</body>
</html>
